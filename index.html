<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Equipe</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --line:#6c7bff; --text:#eef0ff; --muted:#9aa3d0;
  --accent:#7c5cff; --accent2:#22d3ee; --ok:#34d399; --danger:#fb7185; --gold:#facc15; --radius:26px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 50% -10%,#2a2f66 0%,transparent 60%),var(--bg);
  min-height:100vh;
}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px;flex-wrap:wrap}
header h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;color:var(--text)}
.btn{padding:10px 18px;border-radius:999px;background:var(--bg2);border:1px solid #2c3260;transition:.2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;font-weight:600}

#tree{position:relative;padding:10px 24px 80px;max-width:1300px;margin:0 auto}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lines path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;opacity:.7;stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
#lines polygon{fill:var(--line);opacity:.9}

.root-wrap{display:flex;justify-content:center;margin-bottom:90px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 28px}

.node{
  position:relative;background:var(--card);border-radius:var(--radius);padding:20px 22px;width:230px;text-align:center;
  border:1px solid #2f3566;cursor:pointer;transition:.25s;box-shadow:0 10px 30px #0006;
}
.node:hover{transform:translateY(-5px);box-shadow:0 18px 40px #0008;border-color:var(--c,var(--accent))}
.node .avatar{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  font-size:1.5rem;font-weight:700;background:var(--c,var(--accent));box-shadow:0 0 0 5px #ffffff0f;
}
.node h3{margin:0;font-size:1.05rem}
.node .role{color:var(--muted);font-size:.85rem;margin-top:2px;min-height:1.2em}
.bar{height:7px;background:#ffffff14;border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--accent)),var(--accent2));border-radius:99px;transition:width .4s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:8px}
.badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:#facc1522;color:var(--gold);font-size:.8rem;font-weight:600}
.node.boss{
  width:290px;padding:26px;border:1px solid #8b7bff;
  background:linear-gradient(145deg,#2b2466,#1d2a5c);
  box-shadow:0 0 60px #7c5cff55,0 14px 40px #0008;
}
.node.boss .avatar{width:84px;height:84px;font-size:2.4rem;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #7c5cff22,0 0 40px #22d3ee55}}
.node.add{background:transparent;border:2px dashed #3a4180;display:grid;place-items:center;min-height:170px;color:var(--muted);box-shadow:none}
.node.add:hover{color:var(--text);border-color:var(--accent)}
.node.add span{font-size:2.4rem;line-height:1}

/* painel lateral */
#overlay{position:fixed;inset:0;background:#05061088;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s;z-index:10}
#overlay.open{opacity:1;pointer-events:auto}
#panel{
  --c:var(--accent);
  position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--bg2);z-index:11;
  border-radius:32px 0 0 32px;padding:26px;overflow-y:auto;transform:translateX(105%);transition:.3s cubic-bezier(.2,.8,.2,1);
  box-shadow:-20px 0 60px #0008;display:flex;flex-direction:column;gap:16px;
}
#panel.wide{width:min(1020px,100%)}
#panel.open{transform:none}
.ph{display:flex;align-items:center;gap:14px}
.ph .avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;flex:none}
.ph .info{flex:1;min-width:0}
.ph input{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font:inherit;padding:2px 0}
.ph input:hover,.ph input:focus{border-bottom-color:#3a4180;outline:0}
.ph input.name{font-size:1.25rem;font-weight:700}
.ph input.rolei{color:var(--muted);font-size:.9rem}
.x{background:#ffffff10;width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.x:hover{background:#ffffff22}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:5px;gap:4px}
.tabs button{flex:1;padding:9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--card);color:var(--text)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .ttl{font-weight:700;font-size:1.05rem;text-align:center;flex:1}
.nav button{background:var(--card);border-radius:999px;padding:8px 14px;border:1px solid #2c3260}
.nav button:hover{border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=time]{
  padding:11px 14px;border-radius:999px;border:1px solid #2c3260;background:var(--bg);color:var(--text);font:inherit;color-scheme:dark;min-width:0
}
input:focus{outline:0;border-color:var(--accent)}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input[type=text]{flex:1;min-width:140px}
.addform input[type=number]{width:108px;flex:none}
.addform input[type=date]{width:150px;flex:none;font-size:.85rem}
.addform input[type=time]{width:112px;flex:none;font-size:.85rem}
.addform .go{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1.3rem;font-weight:700;flex:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:12px;background:var(--card);padding:13px 16px;border-radius:20px;border:1px solid #2a3060}
li.stk{flex-direction:column;align-items:stretch;gap:10px}
li .top{display:flex;align-items:center;gap:10px}
li .t{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.del{background:transparent;color:var(--muted);font-size:1rem;width:28px;height:28px;border-radius:50%;flex:none}
.del:hover{color:var(--danger);background:#ffffff10}
.cnt{color:var(--muted);font-size:.8rem;white-space:nowrap}
.cfg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.cfg input{width:66px;padding:6px 10px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.danger{margin-top:auto;background:transparent;color:var(--danger);padding:10px;border-radius:999px;border:1px solid #fb718555}
.danger:hover{background:#fb718518}

/* bolinhas */
.dotc{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;font-size:.8rem;color:#06231a}
.dotc:hover{border-color:var(--ok)}
.dotc.on{background:var(--ok);border-color:var(--ok)}
.dotc.on::after{content:"✓"}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dd{width:30px;height:30px;border-radius:50%;border:1.5px solid #3a4180;background:transparent;font-size:.72rem;color:var(--muted);padding:0}
.dd.we{opacity:.45}
.dd.td{border-color:var(--accent2);color:var(--text)}
.dd:hover{border-color:var(--c)}
.dd.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700;opacity:1}

/* resultado / bonificacao */
.score{background:linear-gradient(145deg,#2b2466,#1d2a5c);border-radius:24px;padding:18px 20px;border:1px solid #4a4399}
.score .big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.score .pct{font-size:2.2rem;font-weight:800;line-height:1}
.score .money{font-size:1.5rem;font-weight:800;color:var(--gold)}
.score small{color:var(--muted)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:14px 16px;color:var(--muted);font-size:.9rem}
.mini b{color:var(--text)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:999px;background:var(--bg);border:1px solid #2c3260;font-weight:600;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.fld{display:flex;flex-direction:column;gap:6px;flex:1;font-size:.82rem;color:var(--muted)}
.fld input{width:100%}
.frow{display:flex;gap:12px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--muted);font-weight:500;text-align:left;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid #2a3060}
td.r,th.r{text-align:right}
.warn{background:#facc1514;color:var(--gold);border-radius:14px;padding:10px 14px;font-size:.82rem}

/* calendario */
.views{display:flex;background:var(--bg);border-radius:999px;padding:5px;gap:4px}
.views button{flex:1;padding:9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:600}
.views button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.col{background:var(--card);border-radius:18px;padding:10px;border:1px solid #2a3060;min-height:150px;display:flex;flex-direction:column;gap:6px}
.col.sel{border-color:var(--accent2)}
.col.today .hd{color:var(--accent2)}
.col .hd{width:100%;background:transparent;text-align:center;font-weight:700;padding:2px 0 6px;border-bottom:1px solid #2a3060;font-size:.85rem}
.col .hd small{display:block;color:var(--muted);font-weight:400;font-size:.7rem}
.ct{display:flex;gap:7px;align-items:flex-start;font-size:.8rem;word-break:break-word}
.ct .dotc{width:18px;height:18px;font-size:.6rem;margin-top:1px}
.ct.done span{text-decoration:line-through;color:var(--muted)}
.ct small{color:var(--muted);display:block}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg .dh{text-align:center;color:var(--muted);font-size:.75rem;padding:4px}
.cell{background:var(--card);border:1px solid #2a3060;border-radius:14px;min-height:62px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--text)}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.35}
.cell.sel{border-color:var(--accent2);box-shadow:0 0 0 2px #22d3ee33}
.cell.today b{color:var(--accent2)}
.cell b{font-size:.8rem}
.cell .dd2{display:flex;gap:3px;flex-wrap:wrap}
.cell .dd2 i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.cell .dd2 i.on{background:var(--ok);border-color:var(--ok)}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ym{background:var(--card);border-radius:20px;padding:16px;border:1px solid #2a3060;text-align:left;color:var(--text)}
.ym:hover{border-color:var(--accent)}
.ym.now{border-color:var(--accent2)}
.ym h4{margin:0 0 4px}
.ym small{color:var(--muted)}
.sub{font-weight:700;color:var(--muted);font-size:.85rem;margin-top:4px}

.hub{display:flex;align-items:center;justify-content:center;gap:110px}
.node.side{width:250px}
.node.side .avatar{font-size:1.9rem;background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.node.side[data-id=maint] .avatar{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.node.side[data-id=stock] .avatar{background:linear-gradient(135deg,#10b981,#0ea5e9)}
.badge.bad{background:#fb718522;color:var(--danger)}
.badge.good{background:#34d39922;color:var(--ok)}
select,textarea{padding:11px 14px;border-radius:16px;border:1px solid #2c3260;background:var(--bg);color:var(--text);font:inherit;color-scheme:dark;min-width:0}
select{border-radius:999px}
textarea{resize:vertical;width:100%;font-size:.88rem}
select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid #2a3060;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:.75rem}
.kpi b{font-size:1.15rem}
.kpi.warn b{color:var(--gold)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:#34d39922;color:var(--ok)}
.pill.warn{background:#facc1522;color:var(--gold)}
.pill.bad{background:#fb718522;color:var(--danger)}
.pill.info{background:#60a5fa22;color:#60a5fa}
.tw{overflow-x:auto;background:var(--card);border:1px solid #2a3060;border-radius:20px;padding:6px 10px}
.tw table{min-width:760px}
.tw td small{display:block;color:var(--muted);font-size:.72rem}
.tw td.act{white-space:nowrap;text-align:right}
.ib{background:#ffffff0d;width:30px;height:30px;border-radius:10px;font-size:.85rem;margin-left:3px}
.ib:hover{background:#ffffff22}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:var(--card);border:1px solid #2a3060;border-radius:22px;padding:16px}
.pf .fld.wide{grid-column:span 2}
.pf .fld input,.pf .fld select{width:100%}
.pf .bt{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.movf{background:var(--card);border:1px solid var(--accent);border-radius:22px;padding:14px;align-items:center}
.movf b{flex:1 1 100%}
.pri{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.pri.alta{background:var(--danger)}.pri.media{background:var(--gold)}.pri.baixa{background:var(--ok)}
.eq{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font:inherit;font-weight:700;font-size:1.02rem;padding:2px 0}
.eq:hover,.eq:focus{border-bottom-color:#3a4180;outline:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mgrid .fld textarea{width:100%}
li.mi.fin{opacity:.8}
.cfg select{padding:6px 10px;font-size:.82rem}
.cfg input[type=text]{width:140px}
@media(max-width:1000px){
  .hub{flex-direction:column;gap:20px}
  .node.boss{order:3}
  .node.side{width:100%;max-width:320px}
}
@media(max-width:700px){
  #panel{border-radius:0;padding:20px}
  .pf .fld.wide{grid-column:auto}
  .node{width:100%;max-width:300px}.node.boss{width:100%;max-width:320px}
  .wk{grid-template-columns:1fr}.col{min-height:0}
  .col .hd{text-align:left}
}
</style>
</head>
<body>
<header>
  <h1>🧠 MINHA EQUIPE</h1>
  <div class="actions">
    <button class="btn" id="exp">Exportar backup</button>
    <button class="btn" id="imp">Importar</button>
    <button class="btn primary" id="addTop">+ Funcionário</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>

<div id="tree">
  <svg id="lines"></svg>
  <div class="root-wrap" id="rootWrap"></div>
  <div class="row" id="row"></div>
</div>

<div id="overlay"></div>
<aside id="panel" aria-live="polite"></aside>

<script>
const KEY = "minha-equipe-v1";
const COLORS = ["#7c5cff","#22d3ee","#f472b6","#fb923c","#34d399","#facc15","#60a5fa","#f87171"];
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DSEM = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const brl = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mkLabel = mk => { const [y,m] = mk.split("-").map(Number); return `${MESES[m-1]} ${y}`; };
const shiftMonth = (mk, n) => { const [y,m] = mk.split("-").map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const daysIn = mk => { const [y,m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const weekdaysIn = mk => { const [y,m] = mk.split("-").map(Number); let c = 0;
  for (let d = 1; d <= daysIn(mk); d++) { const w = new Date(y, m-1, d).getDay(); if (w && w < 6) c++; } return c; };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6) % 7)); return iso(d); };
const todayIso = () => iso(new Date());

/* ---------- dados ---------- */
function normalize(s){
  const mk = monthKey(new Date());
  s.boss = s.boss || { name:"Eu", role:"Dono / Gestor" };
  if (!Array.isArray(s.boss.tasks)) {
    s.boss.tasks = (s.boss.items || []).map(i => ({ id:i.id || uid(), text:i.text, date:i.due || todayIso(), time:"", done:!!i.done }));
  }
  delete s.boss.items;
  s.stock = Object.assign({ name:"Estoque", role:"Produtos da loja", items:[], moves:[] }, s.stock);
  s.stock.items = s.stock.items.map(i => ({ id:i.id || uid(), name:i.name || "Produto", sku:i.sku || "", category:i.category || "",
    unit:i.unit || "un", qty:+i.qty || 0, min:+i.min || 0, cost:+i.cost || 0, price:+i.price || 0, location:i.location || "", supplier:i.supplier || "" }));
  s.stock.moves = s.stock.moves || [];
  s.maint = Object.assign({ name:"Manutenções", role:"Equipamentos e reparos", items:[] }, s.maint);
  s.maint.items = s.maint.items.map(i => ({ id:i.id || uid(), equip:i.equip || "Equipamento", loc:i.loc || "", problem:i.problem || "", todo:i.todo || "",
    done:i.done || "", pri:i.pri || "media", resp:i.resp || "Eu", status:i.status || "aberta", opened:i.opened || todayIso(), closed:i.closed || "" }));
  s.people.forEach(p => {
    p.bonus = Object.assign({ on:false, amount:0, min:0 }, p.bonus);
    p.items = (p.items || []).map(i => {
      const o = { id:i.id || uid(), type:i.type === "meta" ? "meta" : "demanda", text:i.text,
        weight:+i.weight || 0, target:+i.target || 0, days:i.days || {}, months:i.months || {} };
      if (i.done && o.type === "meta") o.months[mk] = true;
      return o;
    });
  });
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.boss && Array.isArray(s.people)) return normalize(s); } catch(e){}
  return normalize({ boss:{ name:"Eu", role:"Dono / Gestor" }, people:[] });
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

let state = load();
let ui = { id:null, tab:"demanda", mk:monthKey(new Date()), view:"semana", cur:todayIso(), q:"", cat:"", formOpen:false, edit:null, mov:null, stab:"prod", mf:"todas" };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => (n.trim()[0] || "?").toUpperCase();
const target = id => id === "boss" ? state.boss : id === "stock" ? state.stock : id === "maint" ? state.maint : state.people.find(p => p.id === id);

/* ---------- bonificação ---------- */
function calc(p, mk){
  const items = p.items;
  const sum = items.reduce((a, i) => a + i.weight, 0);
  const rows = items.map(i => {
    const w = sum > 0 ? i.weight / sum : 1 / items.length;
    let frac, label;
    if (i.type === "demanda") {
      const done = Object.keys(i.days).filter(k => k.startsWith(mk) && i.days[k]).length;
      const tgt = i.target || weekdaysIn(mk);
      frac = Math.min(1, done / tgt); label = `${done}/${tgt} dias`;
    } else {
      frac = i.months[mk] ? 1 : 0; label = frac ? "Cumprida" : "Pendente";
    }
    return { item:i, w, frac, label, pts:w * frac * 100 };
  });
  const pct = rows.reduce((a, r) => a + r.pts, 0);
  const reached = pct >= p.bonus.min;
  const money = p.bonus.on && reached ? p.bonus.amount * pct / 100 : 0;
  return { rows, pct, sum, money, reached };
}

/* ---------- árvore ---------- */
function card(p, id){
  const boss = id === "boss", side = id === "stock" || id === "maint";
  const el = document.createElement("div");
  el.className = "node" + (boss ? " boss" : side ? " side" : "");
  el.dataset.id = id;
  let bar, l, r, extra = "";
  if (boss) {
    const t = p.tasks.filter(x => x.date === todayIso());
    const d = t.filter(x => x.done).length;
    bar = t.length ? Math.round(d / t.length * 100) : 0; l = `Hoje: ${d}/${t.length} feitas`; r = bar + "%";
  } else if (id === "stock") {
    const k = stockStats(p), bad = k.out + k.low;
    bar = k.n ? Math.round((k.n - bad) / k.n * 100) : 0; l = `${k.n} produtos`; r = brl(k.cost);
    extra = bad ? `<div class="badge bad">⚠ ${bad} em falta/baixo</div>` : (k.n ? `<div class="badge good">✔ Tudo em dia</div>` : "");
  } else if (id === "maint") {
    const done = p.items.filter(i => i.status === "concluida").length, open = p.items.length - done;
    const urg = p.items.filter(i => i.status !== "concluida" && i.pri === "alta").length;
    bar = p.items.length ? Math.round(done / p.items.length * 100) : 0; l = `${open} em aberto`; r = `${done} concluídas`;
    extra = urg ? `<div class="badge bad">🔴 ${urg} urgente${urg > 1 ? "s" : ""}</div>` : "";
  } else {
    el.style.setProperty("--c", p.color);
    const c = calc(p, monthKey(new Date()));
    bar = Math.round(c.pct); l = "Nota do mês"; r = bar + "%";
    if (p.bonus.on) extra = `<div class="badge">💰 ${brl(c.money)}</div>`;
  }
  const icon = boss ? "🧠" : id === "stock" ? "📦" : id === "maint" ? "🔧" : esc(initial(p.name));
  el.innerHTML = `
    <div class="avatar">${icon}</div>
    <h3>${esc(p.name)}</h3>
    <div class="role">${esc(p.role || "")}</div>
    <div class="bar"><i style="width:${bar}%"></i></div>
    <div class="stats"><span>${l}</span><span>${r}</span></div>${extra}`;
  el.onclick = () => openPanel(id);
  return el;
}
const cardFor = id => card(target(id), id);

function render(){

function drawLines(){
  const svg = $("#lines"), tree = $("#tree");
  const tr = tree.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${tr.width} ${tr.height}`);
  const b = $(".node.boss").getBoundingClientRect();
  const x1 = b.left + b.width/2 - tr.left, y1 = b.bottom - tr.top;
  let out = "";
  document.querySelectorAll("#row .node:not(.add)").forEach(n => {
    const r = n.getBoundingClientRect();
    const x2 = r.left + r.width/2 - tr.left, y2 = r.top - tr.top - 6;
    const dy = (y2 - y1) / 2;
    out += `<path d="M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}"/>`;
    out += `<polygon points="${x2-7},${y2-4} ${x2+7},${y2-4} ${x2},${y2+7}"/>`;
  });
  if (getComputedStyle($("#hub")).flexDirection === "row") {
    const y = b.top + b.height/2 - tr.top;
    [["maint", -1], ["stock", 1]].forEach(([id, d]) => {
      const n = document.querySelector(`.node[data-id="${id}"]`); if (!n) return;
      const r = n.getBoundingClientRect();
      const xa = (d < 0 ? b.left : b.right) - tr.left, tip = (d < 0 ? r.right + 6 : r.left - 6) - tr.left;
      out += `<path d="M${xa},${y} L${tip - d*8},${y}"/>`;
      out += `<polygon points="${tip},${y} ${tip - d*11},${y-7} ${tip - d*11},${y+7}"/>`;
    });
  }
  svg.innerHTML = out;
}
addEventListener("resize", drawLines);

/* ---------- estoque ---------- */
const UNITS = ["un","cx","pç","kg","g","m","L","pct","par"];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtQ = n => (Math.round(n * 1000) / 1000).toLocaleString("pt-BR");
const fmtDT = s => { const d = new Date(s); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }); };
const fmtD = s => s ? s.split("-").reverse().join("/") : "";
const stStatus = i => i.qty <= 0 ? ["Sem estoque", "bad"] : (i.min > 0 && i.qty <= i.min ? ["Baixo", "warn"] : ["OK", "ok"]);
const MV = { in:["Entrada","ok"], out:["Saída","bad"], adj:["Ajuste","warn"] };

function stockStats(s){
  let units = 0, cost = 0, sale = 0, low = 0, out = 0;
  s.items.forEach(i => { units += i.qty; cost += i.qty * i.cost; sale += i.qty * i.price;
    if (i.qty <= 0) out++; else if (i.min > 0 && i.qty <= i.min) low++; });
  return { n:s.items.length, units, cost, sale, low, out };
}

function stockHtml(s){
  const k = stockStats(s);
  const kp = (l, v, c = "") => `<div class="kpi ${c}"><small>${l}</small><b>${v}</b></div>`;
  const cats = [...new Set(s.items.map(i => i.category).filter(Boolean))].sort();
  let h = `<div class="kpis">${kp("Produtos cadastrados", k.n)}${kp("Valor em estoque (custo)", brl(k.cost))}
    ${kp("Valor de venda potencial", brl(k.sale))}${kp("Atenção", `${k.out} sem estoque · ${k.low} baixo`, k.out + k.low ? "warn" : "")}</div>`;
  h += `<div class="tabs"><button data-act="stab" data-t="prod" class="${ui.stab==="prod"?"on":""}">Produtos</button>
    <button data-act="stab" data-t="mov" class="${ui.stab==="mov"?"on":""}">Movimentações</button></div>`;
  h += `<div class="addform"><input type="text" data-f="q" placeholder="Buscar produto, SKU, local, fornecedor…" value="${esc(ui.q)}" autocomplete="off">`;
  if (ui.stab === "prod") h += `<select data-f="cat" aria-label="Categoria"><option value="">Todas as categorias</option>
      ${cats.map(c => `<option ${c===ui.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <button class="btn primary" data-act="newprod">+ Novo produto</button><button class="btn" data-act="csv">Exportar CSV</button>`;
  h += `</div>`;
  if (ui.formOpen) h += prodForm(s, cats);
  if (ui.mov) {
    const it = s.items.find(i => i.id === ui.mov.id), t = ui.mov.type;
    if (it) h += `<form class="addform movf" data-form="move"><b>${t==="in" ? "➕ Entrada" : t==="out" ? "➖ Saída" : "⚖ Ajuste de inventário"} — ${esc(it.name)}
      <small style="color:var(--muted)">(saldo atual: ${fmtQ(it.qty)} ${esc(it.unit)})</small></b>
      <input type="number" name="qty" step="any" min="0" placeholder="${t==="adj" ? "Quantidade contada" : "Quantidade"}" required>
      <input type="text" name="note" placeholder="Observação (nota fiscal, motivo, quem retirou…)">
      <button class="go" type="submit" aria-label="Confirmar">✓</button>
      <button class="btn" type="button" data-act="cancel">Cancelar</button></form>`;
  }
  return h + `<div id="stlist">${stockList()}</div>`;
}

function prodForm(s, cats){
  const it = ui.edit ? s.items.find(i => i.id === ui.edit) : null;
  const v = k => it ? esc(it[k]) : "";
  const fld = (label, name, type = "text", extra = "", cls = "") =>
    `<label class="fld ${cls}">${label}<input type="${type}" name="${name}" value="${v(name)}" ${extra}></label>`;
  return `<form class="pf" data-form="prod">
    <input type="hidden" name="id" value="${it ? it.id : ""}">
    ${fld("Produto *", "text", "text", "required", "wide").replace(`value="${v("text")}"`, `value="${it ? esc(it.name) : ""}"`)}
    ${fld("Código / SKU", "sku")}
    <label class="fld">Categoria<input type="text" name="category" list="cats" value="${v("category")}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>
    <label class="fld">Unidade<select name="unit">${UNITS.map(u => `<option ${it && it.unit===u ? "selected" : ""}>${u}</option>`).join("")}</select></label>
    ${it ? "" : fld("Quantidade inicial", "qty", "number", 'min="0" step="any"')}
    ${fld("Estoque mínimo", "min", "number", 'min="0" step="any"')}
    ${fld("Custo unitário (R$)", "cost", "number", 'min="0" step="0.01"')}
    ${fld("Preço de venda (R$)", "price", "number", 'min="0" step="0.01"')}
    ${fld("Local / prateleira", "location")}
    ${fld("Fornecedor", "supplier")}
    <div class="bt"><button type="button" class="btn" data-act="cancel">Cancelar</button><button type="submit" class="btn primary">${it ? "Salvar alterações" : "Cadastrar produto"}</button></div>
  </form>`;
}

function stockList(){
  const s = state.stock, q = ui.q.trim().toLowerCase();
  if (ui.stab === "mov") {
    const rows = s.moves.filter(m => !q || (m.pname + " " + m.note).toLowerCase().includes(q)).slice(0, 200);
    if (!rows.length) return `<div class="empty">Nenhuma movimentação registrada.</div>`;
    return `<div class="tw"><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th class="r">Qtd</th><th class="r">Saldo</th><th>Obs.</th></tr>` +
      rows.map(m => `<tr><td>${fmtDT(m.date)}</td><td>${esc(m.pname)}</td><td><span class="pill ${MV[m.type][1]}">${MV[m.type][0]}</span></td>
        <td class="r">${m.delta > 0 ? "+" : ""}${fmtQ(m.delta)} ${esc(m.unit)}</td><td class="r">${fmtQ(m.after)}</td><td>${esc(m.note || "")}</td></tr>`).join("") + `</table></div>`;
  }
  const rows = s.items.filter(i => (!ui.cat || i.category === ui.cat) &&
    (!q || [i.name, i.sku, i.category, i.location, i.supplier].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (!rows.length) return `<div class="empty">${s.items.length ? "Nada encontrado com esse filtro." : "Estoque vazio.<br>Clique em “+ Novo produto” para lançar o primeiro."}</div>`;
  const tot = rows.reduce((a, i) => a + i.qty * i.cost, 0);
  return `<div class="tw"><table><tr><th>SKU</th><th>Produto</th><th>Categoria</th><th class="r">Qtd</th><th class="r">Mín.</th>
    <th class="r">Custo</th><th class="r">Preço</th><th class="r">Valor (custo)</th><th></th></tr>` +
    rows.map(i => { const [lb, cl] = stStatus(i); return `<tr>
      <td>${esc(i.sku)}</td>
      <td><b>${esc(i.name)}</b><small>${[i.location && "📍 " + esc(i.location), i.supplier && esc(i.supplier)].filter(Boolean).join(" · ")}</small></td>
      <td>${esc(i.category)}</td>
      <td class="r"><span class="pill ${cl}" title="${lb}">${fmtQ(i.qty)} ${esc(i.unit)}</span></td>
      <td class="r">${i.min ? fmtQ(i.min) : "—"}</td><td class="r">${brl(i.cost)}</td><td class="r">${brl(i.price)}</td>
      <td class="r">${brl(i.qty * i.cost)}</td>
      <td class="act">
        <button class="ib" data-act="mov" data-t="in" data-id="${i.id}" title="Entrada" aria-label="Entrada">➕</button>
        <button class="ib" data-act="mov" data-t="out" data-id="${i.id}" title="Saída" aria-label="Saída">➖</button>
        <button class="ib" data-act="mov" data-t="adj" data-id="${i.id}" title="Ajustar (inventário)" aria-label="Ajustar">⚖</button>
        <button class="ib" data-act="edit" data-id="${i.id}" title="Editar" aria-label="Editar">✎</button>
        <button class="ib" data-act="delprod" data-id="${i.id}" title="Excluir" aria-label="Excluir">✕</button></td></tr>`; }).join("") +
    `<tr><td colspan="7" style="color:var(--muted)">${rows.length} produto(s)</td><td class="r"><b>${brl(tot)}</b></td><td></td></tr></table></div>`;
}

function stockClick(a, D, s){
  if (a === "stab") { ui.stab = D.t; ui.formOpen = false; ui.mov = null; renderPanel(); return true; }
  if (a === "newprod") { ui.formOpen = !ui.formOpen; ui.edit = null; ui.mov = null; renderPanel(); return true; }
  if (a === "edit") { ui.edit = D.id; ui.formOpen = true; ui.mov = null; renderPanel(); return true; }
  if (a === "cancel") { ui.formOpen = false; ui.edit = null; ui.mov = null; renderPanel(); return true; }
  if (a === "mov") { ui.mov = { id:D.id, type:D.t }; ui.formOpen = false; renderPanel(); const q = panel.querySelector('[name=qty]'); if (q) q.focus(); return true; }
  if (a === "delprod") {
    const it = s.items.find(i => i.id === D.id);
    if (!confirm(`Excluir "${it.name}" do estoque?`)) return true;
    s.items = s.items.filter(i => i !== it); s.moves = s.moves.filter(m => m.pid !== it.id); refresh(); return true;
  }
  if (a === "csv") {
    const head = ["SKU","Produto","Categoria","Unidade","Quantidade","Mínimo","Custo","Preço","Local","Fornecedor"];
    const rows = s.items.map(i => [i.sku, i.name, i.category, i.unit, i.qty, i.min, i.cost, i.price, i.location, i.supplier]);
    const csv = [head, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
    el.download = `estoque-${todayIso()}.csv`; el.click(); URL.revokeObjectURL(el.href); return true;
  }
  return false;
}

/* ---------- manutenções ---------- */
const MST = { aberta:["Aberta","warn"], andamento:["Em andamento","info"], concluida:["Concluída","ok"] };
const PRI_L = { alta:"Alta", media:"Média", baixa:"Baixa" };
const respList = cur => { const l = ["Eu", ...state.people.map(p => p.name)]; if (cur && !l.includes(cur)) l.push(cur); return l; };

function maintHtml(m){
  const c = k => m.items.filter(i => i.status === k).length;
  const kp = (l, v, cl = "") => `<div class="kpi ${cl}"><small>${l}</small><b>${v}</b></div>`;
  const urg = m.items.filter(i => i.status !== "concluida" && i.pri === "alta").length;
  let h = `<div class="kpis">${kp("Abertas", c("aberta"))}${kp("Em andamento", c("andamento"))}${kp("Concluídas", c("concluida"))}${kp("Urgentes em aberto", urg, urg ? "warn" : "")}</div>`;
  h += `<form class="pf" data-form="maint">
    <label class="fld wide">Equipamento *<input type="text" name="text" placeholder="Ex.: Ar-condicionado da loja, Impressora fiscal…" required></label>
    <label class="fld">Local / setor<input type="text" name="loc"></label>
    <label class="fld">Prioridade<select name="pri"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></label>
    <label class="fld wide">O que é (problema)<textarea name="problem" rows="2"></textarea></label>
    <label class="fld wide">O que precisa ser feito<textarea name="todo" rows="2"></textarea></label>
    <label class="fld">Responsável<select name="resp">${respList().map(r => `<option>${esc(r)}</option>`).join("")}</select></label>
    <div class="bt" style="align-items:flex-end"><button type="submit" class="btn primary">+ Registrar manutenção</button></div></form>`;
  h += `<div class="seg">${[["todas","Todas"],["aberta","Abertas"],["andamento","Em andamento"],["concluida","Concluídas"]].map(([k, l]) =>
    `<button data-act="mf" data-v="${k}" class="${ui.mf===k?"on":""}">${l}</button>`).join("")}</div>`;
  const order = { alta:0, media:1, baixa:2 };
  const rows = m.items.filter(i => ui.mf === "todas" || i.status === ui.mf)
    .sort((a, b) => (a.status === "concluida") - (b.status === "concluida") || order[a.pri] - order[b.pri] || b.opened.localeCompare(a.opened));
  h += `<ul>` + (rows.map(i => `<li class="stk mi ${i.status==="concluida"?"fin":""}">
    <div class="top"><span class="pri ${i.pri}" title="Prioridade ${PRI_L[i.pri]}"></span>
      <input class="eq" data-f="mequip" data-id="${i.id}" value="${esc(i.equip)}" aria-label="Equipamento">
      <span class="pill ${MST[i.status][1]}">${MST[i.status][0]}</span>
      <button class="del" data-act="mdel" data-id="${i.id}" aria-label="Remover">✕</button></div>
    <div class="mgrid">
      <label class="fld">O que é (problema)<textarea rows="2" data-f="mproblem" data-id="${i.id}">${esc(i.problem)}</textarea></label>
      <label class="fld">O que precisa ser feito<textarea rows="2" data-f="mtodo" data-id="${i.id}">${esc(i.todo)}</textarea></label>
      <label class="fld">O que foi feito<textarea rows="2" data-f="mdone" data-id="${i.id}">${esc(i.done)}</textarea></label></div>
    <div class="cfg">Local <input type="text" data-f="mloc" data-id="${i.id}" value="${esc(i.loc)}">
      Prioridade <select data-f="mpri" data-id="${i.id}">${Object.keys(PRI_L).map(k => `<option value="${k}" ${i.pri===k?"selected":""}>${PRI_L[k]}</option>`).join("")}</select>
      Responsável <select data-f="mresp" data-id="${i.id}">${respList(i.resp).map(r => `<option ${r===i.resp?"selected":""}>${esc(r)}</option>`).join("")}</select>
      · Aberta em ${fmtD(i.opened)}${i.closed ? ` · Concluída em ${fmtD(i.closed)}` : ""}</div>
    <div class="seg">${Object.keys(MST).map(k => `<button data-act="mstatus" data-id="${i.id}" data-v="${k}" class="${i.status===k?"on":""}">${MST[k][0]}</button>`).join("")}</div>
  </li>`).join("") || `<div class="empty">Nenhuma manutenção ${ui.mf === "todas" ? "registrada" : "neste filtro"}.</div>`) + `</ul>`;
  return h;
}

function maintClick(a, D, m){
  if (a === "mf") { ui.mf = D.v; renderPanel(); return true; }
  if (a === "mstatus") { const i = m.items.find(x => x.id === D.id); i.status = D.v; i.closed = D.v === "concluida" ? todayIso() : ""; refresh(); return true; }
  if (a === "mdel") {
    const i = m.items.find(x => x.id === D.id);
    if (!confirm(`Remover a manutenção de "${i.equip}"?`)) return true;
    m.items = m.items.filter(x => x !== i); refresh(); return true;
  }
  return false;
}

function sideChange(e, f, p){
  const t = e.target;
  if (f === "cat") { ui.cat = t.value; renderPanel(); return; }
  const map = { mequip:"equip", mproblem:"problem", mtodo:"todo", mdone:"done", mloc:"loc", mpri:"pri", mresp:"resp" };
  if (!map[f]) return;
  const i = p.items.find(x => x.id === t.dataset.id); if (!i) return;
  i[map[f]] = t.value; save(); render();
  if (f === "mpri" || f === "mresp") renderPanel();
}

function sideSubmit(form, fd, p){
  const kind = form.dataset.form;
  if (kind === "prod") {
    const name = (fd.get("text") || "").trim(); if (!name) return;
    const data = { name, sku:(fd.get("sku") || "").trim(), category:(fd.get("category") || "").trim(), unit:fd.get("unit") || "un",
      min:Math.max(0, num(fd.get("min"))), cost:Math.max(0, num(fd.get("cost"))), price:Math.max(0, num(fd.get("price"))),
      location:(fd.get("location") || "").trim(), supplier:(fd.get("supplier") || "").trim() };
    const id = fd.get("id");
    if (id) Object.assign(p.items.find(i => i.id === id), data);
    else {
      const it = Object.assign({ id:uid(), qty:0 }, data), q = Math.max(0, num(fd.get("qty")));
      p.items.push(it);
      if (q > 0) { it.qty = q; stockMove(p, it, "in", q, "Estoque inicial"); }
    }
    ui.formOpen = false; ui.edit = null; return refresh();
  }
  if (kind === "move") {
    const it = p.items.find(i => i.id === ui.mov.id), t = ui.mov.type, q = num(fd.get("qty")), note = (fd.get("note") || "").trim();
    if (!it || q < 0 || (t !== "adj" && q <= 0)) return;
    let delta;
    if (t === "in") delta = q;
    else if (t === "out") { if (q > it.qty) { alert(`Saldo insuficiente: só há ${fmtQ(it.qty)} ${it.unit} em estoque.`); return; } delta = -q; }
    else delta = q - it.qty;
    if (delta !== 0) { it.qty += delta; stockMove(p, it, t, delta, note); }
    ui.mov = null; return refresh();
  }
  if (kind === "maint") {
    const equip = (fd.get("text") || "").trim(); if (!equip) return;
    p.items.push({ id:uid(), equip, loc:(fd.get("loc") || "").trim(), problem:(fd.get("problem") || "").trim(), todo:(fd.get("todo") || "").trim(),
      done:"", pri:fd.get("pri") || "media", resp:fd.get("resp") || "Eu", status:"aberta", opened:todayIso(), closed:"" });
    return refresh();
  }
}
function stockMove(s, it, type, delta, note){
  s.moves.unshift({ id:uid(), pid:it.id, pname:it.name, unit:it.unit, type, delta, after:it.qty, note, date:new Date().toISOString() });
  if (s.moves.length > 3000) s.moves.length = 3000;
}

/* ---------- eventos do painel ---------- */
function refresh(){ save(); renderPanel(); render(); }
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = target(ui.id), D = b.dataset, a = D.act;
  const item = () => p.items.find(i => i.id === D.id);
  const task = () => p.tasks.find(t => t.id === D.id);
  if (a === "close") return closePanel();
  if (ui.id === "stock" && stockClick(a, D, p)) return;
  if (ui.id === "maint" && maintClick(a, D, p)) return;
  if (a === "tab") { ui.tab = D.t; return renderPanel(); }
  if (a === "mnav") { ui.mk = shiftMonth(ui.mk, +D.d); return renderPanel(); }
  if (a === "day") { const i = item(); i.days[D.day] = !i.days[D.day]; if (!i.days[D.day]) delete i.days[D.day]; return refresh(); }
  if (a === "mtoggle") { const i = item(); i.months[ui.mk] = !i.months[ui.mk]; return refresh(); }
  if (a === "delitem") { p.items = p.items.filter(i => i.id !== D.id); return refresh(); }
  if (a === "bonuson") { p.bonus.on = D.v === "1"; return refresh(); }
  if (a === "rm") {
    if (!confirm(`Remover ${p.name} e tudo que está no card?`)) return;
    state.people = state.people.filter(x => x !== p); save(); closePanel(); return render();
  }
  // calendário
  if (a === "view") { ui.view = D.v; return renderPanel(); }
  if (a === "today") { ui.cur = todayIso(); return renderPanel(); }
  if (a === "cnav") {
    const n = +D.d, c = parse(ui.cur);
    if (ui.view === "dia") ui.cur = addDays(ui.cur, n);
    else if (ui.view === "semana") ui.cur = addDays(ui.cur, 7 * n);
    else if (ui.view === "mes") ui.cur = iso(new Date(c.getFullYear(), c.getMonth() + n, 1));
    else ui.cur = iso(new Date(c.getFullYear() + n, c.getMonth(), 1));
    return renderPanel();
  }
  if (a === "pick") { ui.cur = D.date; return renderPanel(); }
  if (a === "gomonth") { ui.cur = D.date; ui.view = "mes"; return renderPanel(); }
  if (a === "ttoggle") { const t = task(); t.done = !t.done; return refresh(); }
  if (a === "tdel") { p.tasks = p.tasks.filter(t => t.id !== D.id); return refresh(); }
});
panel.addEventListener("input", e => {
  const f = e.target.dataset.f, p = target(ui.id);
  if (f === "q") { ui.q = e.target.value; const l = $("#stlist"); if (l) l.innerHTML = stockList(); return; }
  if (f !== "name" && f !== "role") return;
  if (f === "name") p.name = e.target.value || "Sem nome"; else p.role = e.target.value;
  save();
  const old = document.querySelector(`.node[data-id="${ui.id}"]`);
  old.replaceWith(cardFor(ui.id)); drawLines();
});
panel.addEventListener("change", e => {
  const f = e.target.dataset.f, p = target(ui.id); if (!f || f === "name" || f === "role" || f === "q") return;
  if (ui.id === "stock" || ui.id === "maint") return sideChange(e, f, p);
  const v = Math.max(0, +e.target.value || 0);
  if (f === "amount" || f === "min") p.bonus[f] = v;
  else { const i = p.items.find(x => x.id === e.target.dataset.id); i[f] = v; }
  refresh();
});
panel.addEventListener("submit", e => {
  e.preventDefault();
  const p = target(ui.id), fd = new FormData(e.target), text = (fd.get("text") || "").trim();
  if (ui.id === "stock" || ui.id === "maint") return sideSubmit(e.target, fd, p);
  if (!text) return;
  if (e.target.dataset.form === "task") {
    p.tasks.push({ id:uid(), text, date:fd.get("date") || ui.cur, time:fd.get("time") || "", done:false });
    if (fd.get("date")) ui.cur = fd.get("date");
  } else {
    p.items.push({ id:uid(), type:ui.tab, text, weight:Math.max(0, +fd.get("weight") || 0), target:0, days:{}, months:{} });
  }
  refresh();
  const t = panel.querySelector('input[name="text"]'); if (t) t.focus();
});

/* ---------- backup ---------- */
$("#addTop").onclick = addPerson;
$("#exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type:"application/json" }));
  a.download = "minha-equipe-backup.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.boss || !Array.isArray(s.people)) throw 0;
    if (!confirm("Isso substitui os dados atuais. Continuar?")) return;
    state = normalize(s); save(); closePanel(); render();
  } catch { alert("Arquivo inválido."); }
  e.target.value = "";
};

render();
</script>
</body>
</html>
