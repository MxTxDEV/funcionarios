<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Equipe</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --line:#6c7bff; --text:#eef0ff; --muted:#9aa3d0;
  --accent:#7c5cff; --accent2:#22d3ee; --ok:#34d399; --danger:#fb7185; --gold:#facc15; --radius:26px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 50% -10%,#2a2f66 0%,transparent 60%),var(--bg);
  min-height:100vh;
}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 28px;flex-wrap:wrap}
header h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;color:var(--text)}
.btn{padding:10px 18px;border-radius:999px;background:var(--bg2);border:1px solid #2c3260;transition:.2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;font-weight:600}

#tree{position:relative;padding:10px 24px 80px;max-width:1300px;margin:0 auto}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lines path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;opacity:.7;stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
#lines polygon{fill:var(--line);opacity:.9}

.root-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:90px}
.topwrap{margin-bottom:80px;display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 28px}

.node{
  position:relative;background:var(--card);border-radius:var(--radius);padding:20px 22px;width:230px;text-align:center;
  border:1px solid #2f3566;cursor:pointer;transition:.25s;box-shadow:0 10px 30px #0006;
}
.node:hover{transform:translateY(-5px);box-shadow:0 18px 40px #0008;border-color:var(--c,var(--accent))}
.node .avatar{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  font-size:1.5rem;font-weight:700;background:var(--c,var(--accent));box-shadow:0 0 0 5px #ffffff0f;
}
.node h3{margin:0;font-size:1.05rem}
.node .role{color:var(--muted);font-size:.85rem;margin-top:2px;min-height:1.2em}
.bar{height:7px;background:#ffffff14;border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--accent)),var(--accent2));border-radius:99px;transition:width .4s}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:8px}
.badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:#facc1522;color:var(--gold);font-size:.8rem;font-weight:600}
.node.boss{
  width:290px;padding:26px;border:1px solid #8b7bff;
  background:linear-gradient(145deg,#2b2466,#1d2a5c);
  box-shadow:0 0 60px #7c5cff55,0 14px 40px #0008;
}
.node.boss .avatar{width:84px;height:84px;font-size:2.4rem;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #7c5cff22,0 0 40px #22d3ee55}}
.node.add{background:transparent;border:2px dashed #3a4180;display:grid;place-items:center;min-height:170px;color:var(--muted);box-shadow:none}
.node.add:hover{color:var(--text);border-color:var(--accent)}
.node.add span{font-size:2.4rem;line-height:1}

/* painel lateral */
#overlay{position:fixed;inset:0;background:#05061088;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s;z-index:10}
#overlay.open{opacity:1;pointer-events:auto}
#panel{
  --c:var(--accent);
  position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--bg2);z-index:11;
  border-radius:32px 0 0 32px;padding:26px;overflow-y:auto;transform:translateX(105%);transition:.3s cubic-bezier(.2,.8,.2,1);
  box-shadow:-20px 0 60px #0008;display:flex;flex-direction:column;gap:16px;
}
#panel.wide{width:min(1020px,100%)}
#panel.open{transform:none}
.ph{display:flex;align-items:center;gap:14px}
.ph .avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.3rem;flex:none}
.ph .info{flex:1;min-width:0}
.ph input{width:100%;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font:inherit;padding:2px 0}
.ph input:hover,.ph input:focus{border-bottom-color:#3a4180;outline:0}
.ph input.name{font-size:1.25rem;font-weight:700}
.ph input.rolei{color:var(--muted);font-size:.9rem}
.x{background:#ffffff10;width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.x:hover{background:#ffffff22}
.tabs{display:flex;background:var(--bg);border-radius:999px;padding:5px;gap:4px}
.tabs button{flex:1;padding:9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--card);color:var(--text)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .ttl{font-weight:700;font-size:1.05rem;text-align:center;flex:1}
.nav button{background:var(--card);border-radius:999px;padding:8px 14px;border:1px solid #2c3260}
.nav button:hover{border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=time]{
  padding:11px 14px;border-radius:999px;border:1px solid #2c3260;background:var(--bg);color:var(--text);font:inherit;color-scheme:dark;min-width:0
}
input:focus{outline:0;border-color:var(--accent)}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input[type=text]{flex:1;min-width:140px}
.addform input[type=number]{width:108px;flex:none}
.addform input[type=date]{width:150px;flex:none;font-size:.85rem}
.addform input[type=time]{width:112px;flex:none;font-size:.85rem}
.addform .go{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1.3rem;font-weight:700;flex:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:12px;background:var(--card);padding:13px 16px;border-radius:20px;border:1px solid #2a3060}
li.stk{flex-direction:column;align-items:stretch;gap:10px}
li .top{display:flex;align-items:center;gap:10px}
li .t{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--muted)}
li small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.del{background:transparent;color:var(--muted);font-size:1rem;width:28px;height:28px;border-radius:50%;flex:none}
.del:hover{color:var(--danger);background:#ffffff10}
.cnt{color:var(--muted);font-size:.8rem;white-space:nowrap}
.cfg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.cfg input{width:66px;padding:6px 10px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.danger{margin-top:auto;background:transparent;color:var(--danger);padding:10px;border-radius:999px;border:1px solid #fb718555}
.danger:hover{background:#fb718518}

/* bolinhas */
.dotc{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;font-size:.8rem;color:#06231a}
.dotc:hover{border-color:var(--ok)}
.dotc.on{background:var(--ok);border-color:var(--ok)}
.dotc.on::after{content:"✓"}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dd{width:30px;height:30px;border-radius:50%;border:1.5px solid #3a4180;background:transparent;font-size:.72rem;color:var(--muted);padding:0}
.dd.we{opacity:.45}
.dd.td{border-color:var(--accent2);color:var(--text)}
.dd:hover{border-color:var(--c)}
.dd.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700;opacity:1}

/* resultado / bonificacao */
.score{background:linear-gradient(145deg,#2b2466,#1d2a5c);border-radius:24px;padding:18px 20px;border:1px solid #4a4399}
.score .big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.score .pct{font-size:2.2rem;font-weight:800;line-height:1}
.score .money{font-size:1.5rem;font-weight:800;color:var(--gold)}
.score small{color:var(--muted)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:14px 16px;color:var(--muted);font-size:.9rem}
.mini b{color:var(--text)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:999px;background:var(--bg);border:1px solid #2c3260;font-weight:600;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.fld{display:flex;flex-direction:column;gap:6px;flex:1;font-size:.82rem;color:var(--muted)}
.fld input{width:100%}
.frow{display:flex;gap:12px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--muted);font-weight:500;text-align:left;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid #2a3060}
td.r,th.r{text-align:right}
.warn{background:#facc1514;color:var(--gold);border-radius:14px;padding:10px 14px;font-size:.82rem}

/* calendario */
.views{display:flex;background:var(--bg);border-radius:999px;padding:5px;gap:4px}
.views button{flex:1;padding:9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:600}
.views button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.col{background:var(--card);border-radius:18px;padding:10px;border:1px solid #2a3060;min-height:150px;display:flex;flex-direction:column;gap:6px}
.col.sel{border-color:var(--accent2)}
.col.today .hd{color:var(--accent2)}
.col .hd{width:100%;background:transparent;text-align:center;font-weight:700;padding:2px 0 6px;border-bottom:1px solid #2a3060;font-size:.85rem}
.col .hd small{display:block;color:var(--muted);font-weight:400;font-size:.7rem}
.ct{display:flex;gap:7px;align-items:flex-start;font-size:.8rem;word-break:break-word}
.ct .dotc{width:18px;height:18px;font-size:.6rem;margin-top:1px}
.ct.done span{text-decoration:line-through;color:var(--muted)}
.ct small{color:var(--muted);display:block}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg .dh{text-align:center;color:var(--muted);font-size:.75rem;padding:4px}
.cell{background:var(--card);border:1px solid #2a3060;border-radius:14px;min-height:62px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--text)}
.cell:hover{border-color:var(--accent)}
.cell.out{opacity:.35}
.cell.sel{border-color:var(--accent2);box-shadow:0 0 0 2px #22d3ee33}
.cell.today b{color:var(--accent2)}
.cell b{font-size:.8rem}
.cell .dd2{display:flex;gap:3px;flex-wrap:wrap}
.cell .dd2 i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.cell .dd2 i.on{background:var(--ok);border-color:var(--ok)}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ym{background:var(--card);border-radius:20px;padding:16px;border:1px solid #2a3060;text-align:left;color:var(--text)}
.ym:hover{border-color:var(--accent)}
.ym.now{border-color:var(--accent2)}
.ym h4{margin:0 0 4px}
.ym small{color:var(--muted)}
.sub{font-weight:700;color:var(--muted);font-size:.85rem;margin-top:4px}

.node.side[data-id=sales] .avatar{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.pill.mute{background:#ffffff14;color:var(--muted)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto;padding:10px 14px;font-size:.88rem}
.sec{background:var(--card);border:1px solid #2a3060;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:1rem}
.sec .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sec .fld.wide,.g .fld.wide{grid-column:1/-1}
.sec .fld input,.sec .fld select,.sec .fld textarea{width:100%}
.ro{background:var(--bg);border-radius:999px;padding:11px 14px;color:var(--text);font-size:.9rem}
.meta{color:var(--muted);font-size:.78rem}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.tot div{background:var(--bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tot small{color:var(--muted);font-size:.72rem}.tot b{font-size:1.05rem}
.tot .all{background:linear-gradient(145deg,#2b2466,#1d2a5c);border:1px solid #4a4399}.tot .all b{color:var(--gold);font-size:1.25rem}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid #2f3566;display:flex;flex-direction:column;gap:12px}
.tl li{background:transparent;border:0;padding:0;display:block;font-size:.88rem;position:relative}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl li b{color:var(--muted);font-weight:500;font-size:.78rem}
ul.cl{gap:6px}ul.cl li{padding:9px 12px;border-radius:14px}
.mini-in{width:84px;padding:6px 10px;font-size:.85rem;text-align:right}
table.os td small,table.os th{white-space:nowrap}
.clk{cursor:pointer}.clk:hover{background:#ffffff08}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--bg);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px}.kh small{color:var(--muted);font-size:.72rem}
.kc{background:var(--card);border:1px solid #2a3060;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.kc:hover{border-color:var(--accent)}.kc small{color:var(--muted);font-size:.74rem}
.kf{display:flex;justify-content:space-between;font-size:.78rem;margin-top:2px}
.kb2{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.kempty{color:var(--muted);text-align:center;padding:10px}
a.ib{display:inline-grid;place-items:center;text-decoration:none;color:inherit;vertical-align:middle}
li.clk .t small{display:block}
.node.side[data-id=check] .avatar{background:linear-gradient(135deg,#14b8a6,#22c55e)}
ul.cks{gap:8px}
ul.cks li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px}
ul.cks li.nc{border-color:#fb718588;background:#2a1f3a}
ul.cks .t{flex:1 1 220px}ul.cks .t input{width:100%}
ul.cks .note{flex:1 1 100%;font-size:.85rem}
.dotc.big{width:34px;height:34px;font-size:1rem}
.dotc.nc{background:var(--danger);border-color:var(--danger)}.dotc.nc::after{content:"!";font-weight:800;color:#fff}
.dotc.na{border-style:dashed}.dotc.na::after{content:"–";color:var(--muted)}
.kpick{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.kopt{background:var(--bg);border:1px solid #2c3260;border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--text)}
.kopt:hover{border-color:var(--accent)}.kopt small{color:var(--muted);font-size:.75rem}
.chip{background:var(--bg);border:1px solid var(--accent);border-radius:999px;padding:8px 8px 8px 16px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.chip small{color:var(--muted);font-weight:400}
body.davi .topwrap{display:none!important}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.seg3 button{background:var(--bg);border:1px solid #2c3260;border-radius:999px;padding:8px 13px;font-size:.82rem;color:var(--muted);font-weight:600}
.seg3 button:disabled{opacity:.3;cursor:default}
.seg3 button.on.ok{background:#34d39933;border-color:var(--ok);color:var(--ok)}
.seg3 button.on.nc{background:#fb718533;border-color:var(--danger);color:var(--danger)}
.seg3 button.on.na{background:#ffffff1a;color:var(--text)}
.ag{display:flex;flex-direction:column;gap:6px;margin:0}
.ag li{padding:10px 14px;border-radius:16px}
.ag .tm{color:var(--accent2);font-weight:700;min-width:46px;font-size:.85rem}
.sync{font-size:.8rem;color:var(--muted);align-self:center}
.sync.ok{color:var(--ok)}.sync.bad{color:var(--danger)}
.srv-only{display:none}
body.srv .srv-only{display:inline-block}
body.davi .owner-only{display:none}
.locked{max-width:420px;margin:18vh auto 0;padding:32px;text-align:center;background:var(--card);border-radius:var(--radius);border:1px solid #2f3566}
.locked h2{margin:0 0 8px}.locked p{color:var(--muted);margin:0}
#modal{position:fixed;inset:0;background:#050610aa;backdrop-filter:blur(4px);display:none;place-items:center;z-index:20;padding:16px}
#modal.open{display:grid}
#modal .box{background:var(--bg2);border-radius:28px;padding:26px;width:min(520px,100%);display:flex;flex-direction:column;gap:14px;border:1px solid #2f3566}
#modal h3{margin:0}
#modal .lnk{background:var(--bg);border-radius:16px;padding:12px 14px;font-size:.8rem;word-break:break-all;color:var(--muted);user-select:all}
#modal .row2{display:flex;gap:8px;flex-wrap:wrap}
.hub{display:flex;align-items:center;justify-content:center;gap:110px}
.node.side{width:250px}
.node.side .avatar{font-size:1.9rem;background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.node.side[data-id=maint] .avatar{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.node.side[data-id=stock] .avatar{background:linear-gradient(135deg,#10b981,#0ea5e9)}
.badge.bad{background:#fb718522;color:var(--danger)}
.badge.good{background:#34d39922;color:var(--ok)}
select,textarea{padding:11px 14px;border-radius:16px;border:1px solid #2c3260;background:var(--bg);color:var(--text);font:inherit;color-scheme:dark;min-width:0}
select{border-radius:999px}
textarea{resize:vertical;width:100%;font-size:.88rem}
select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid #2a3060;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:.75rem}
.kpi b{font-size:1.15rem}
.kpi.warn b{color:var(--gold)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:#34d39922;color:var(--ok)}
.pill.warn{background:#facc1522;color:var(--gold)}
.pill.bad{background:#fb718522;color:var(--danger)}
.pill.info{background:#60a5fa22;color:#60a5fa}
.tw{overflow-x:auto;background:var(--card);border:1px solid #2a3060;border-radius:20px;padding:6px 10px}
.tw table{min-width:760px}
.tw td small{display:block;color:var(--muted);font-size:.72rem}
.tw td.act{white-space:nowrap;text-align:right}
.ib{background:#ffffff0d;width:30px;height:30px;border-radius:10px;font-size:.85rem;margin-left:3px}
.ib:hover{background:#ffffff22}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:var(--card);border:1px solid #2a3060;border-radius:22px;padding:16px}
.pf .fld.wide{grid-column:span 2}
.pf .fld input,.pf .fld select{width:100%}
.pf .bt{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.movf{background:var(--card);border:1px solid var(--accent);border-radius:22px;padding:14px;align-items:center}
.movf b{flex:1 1 100%}
.pri{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.pri.alta{background:var(--danger)}.pri.media{background:var(--gold)}.pri.baixa{background:var(--ok)}
.eq{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font:inherit;font-weight:700;font-size:1.02rem;padding:2px 0}
.eq:hover,.eq:focus{border-bottom-color:#3a4180;outline:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mgrid .fld textarea{width:100%}
li.mi.fin{opacity:.8}
.cfg select{padding:6px 10px;font-size:.82rem}
.cfg input[type=text]{width:140px}
@media(max-width:1000px){
  .hub{flex-direction:column;gap:20px}
  .node.boss{order:3}
  .node.side{width:100%;max-width:320px}
}
@media(max-width:700px){
  #panel{border-radius:0;padding:20px}
  .pf .fld.wide{grid-column:auto}
  .node{width:100%;max-width:300px}.node.boss{width:100%;max-width:320px}
  .wk{grid-template-columns:1fr}.col{min-height:0}
  .col .hd{text-align:left}
}
</style>
</head>
<body>
<header>
  <h1 id="title">🧠 MINHA EQUIPE</h1>
  <div class="actions">
    <span class="sync" id="sync"></span>
    <button class="btn srv-only" id="acc">🔑 Acesso do Davi</button>
    <button class="btn owner-only" id="exp">Exportar backup</button>
    <button class="btn owner-only" id="imp">Importar</button>
    <button class="btn primary owner-only" id="addTop">+ Funcionário</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</header>

<div id="tree">
  <svg id="lines"></svg>
  <div class="root-wrap" id="rootWrap"></div>
  <div class="row" id="row"></div>
</div>

<div id="overlay"></div>
<aside id="panel" aria-live="polite"></aside>

<script src="merge.js"></script>
<script src="maint.js"></script>
<script src="sales.js"></script>
<script src="check.js"></script>
<script>
let KEY = "minha-equipe-v1";
const COLORS = ["#7c5cff","#22d3ee","#f472b6","#fb923c","#34d399","#facc15","#60a5fa","#f87171"];
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DSEM = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const brl = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mkLabel = mk => { const [y,m] = mk.split("-").map(Number); return `${MESES[m-1]} ${y}`; };
const shiftMonth = (mk, n) => { const [y,m] = mk.split("-").map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const daysIn = mk => { const [y,m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const weekdaysIn = mk => { const [y,m] = mk.split("-").map(Number); let c = 0;
  for (let d = 1; d <= daysIn(mk); d++) { const w = new Date(y, m-1, d).getDay(); if (w && w < 6) c++; } return c; };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6) % 7)); return iso(d); };
const todayIso = () => iso(new Date());

/* ---------- dados ---------- */
function normalize(s){
  const mk = monthKey(new Date());
  s.people = Array.isArray(s.people) ? s.people : [];
  s.boss = s.boss || { name:"Eu", role:"Dono / Gestor" };
  if (!Array.isArray(s.boss.tasks)) {
    s.boss.tasks = (s.boss.items || []).map(i => ({ id:i.id || uid(), text:i.text, date:i.due || todayIso(), time:"", done:!!i.done }));
  }
  delete s.boss.items;
  s.stock = Object.assign({ name:"Estoque", role:"Produtos da loja", items:[], moves:[] }, s.stock);
  s.stock.items = s.stock.items.map(i => ({ id:i.id || uid(), name:i.name || "Produto", sku:i.sku || "", category:i.category || "",
    unit:i.unit || "un", qty:+i.qty || 0, min:+i.min || 0, cost:+i.cost || 0, price:+i.price || 0, location:i.location || "", supplier:i.supplier || "", u:+i.u || 0, ub:i.ub || "" }));
  s.stock.moves = s.stock.moves || [];
  s.maint = Object.assign({ name:"Manutenções", role:"Equipamentos e reparos", items:[] }, s.maint);
  s.maint.items = s.maint.items.map(normMaintItem); numberMaint(s.maint.items);
  s.crm = normCrm(s.crm);
  s.check = normCheck(s.check);
  s.stock.moves = s.stock.moves.map(m => Object.assign({ by:"Eu" }, m));
  s.stock.del = s.stock.del || {}; s.maint.del = s.maint.del || {};
  s.people.forEach(p => {
    p.bonus = Object.assign({ on:false, amount:0, min:0 }, p.bonus);
    p.items = (p.items || []).map(i => {
      const o = { id:i.id || uid(), type:i.type === "meta" ? "meta" : "demanda", text:i.text,
        weight:+i.weight || 0, target:+i.target || 0, days:i.days || {}, months:i.months || {} };
      if (i.done && o.type === "meta") o.months[mk] = true;
      return o;
    });
  });
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.boss && Array.isArray(s.people)) return normalize(s); } catch(e){}
  return normalize({ boss:{ name:"Eu", role:"Dono / Gestor" }, people:[] });
}
const persistLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
let coreU = 0, syncTimer = null;
function save(){
  persistLocal();
  if (MODE === "owner" || MODE === "davi") { coreU = Date.now(); setSync("Salvando…"); clearTimeout(syncTimer); syncTimer = setTimeout(push, 500); }
}

let state;
let MODE = "local";
const ME = () => MODE === "davi" ? "Davi" : "Eu";
const byLabel = b => b === "Eu" && MODE === "davi" ? "Dono" : b;
const stamp = o => { o.u = Date.now(); o.ub = ME(); return o; };
let ui = { id:null, tab:"demanda", mk:monthKey(new Date()), view:"semana", cur:todayIso(), q:"", cat:"", formOpen:false, edit:null, mov:null, stab:"prod", mf:"todas", prevSeen:0, mOpen:null, mNew:false, mq:"", mt:"", ct:"lista", cOpen:null, cNew:false, cq:"", cfT:"", cfS:"", kt:"rev", kOpen:null, kType:null, kNew:false, kNewType:false, kq:"", kfT:"", kPick:null, ks:"" };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => (n.trim()[0] || "?").toUpperCase();
const target = id => id === "boss" ? state.boss : id === "stock" ? state.stock : id === "maint" ? state.maint : id === "sales" ? state.crm : id === "check" ? state.check : state.people.find(p => p.id === id);

/* ---------- bonificação ---------- */
function calc(p, mk){
  const items = p.items;
  const sum = items.reduce((a, i) => a + i.weight, 0);
  const rows = items.map(i => {
    const w = sum > 0 ? i.weight / sum : 1 / items.length;
    let frac, label;
    if (i.type === "demanda") {
      const done = Object.keys(i.days).filter(k => k.startsWith(mk) && i.days[k]).length;
      const tgt = i.target || weekdaysIn(mk);
      frac = Math.min(1, done / tgt); label = `${done}/${tgt} dias`;
    } else {
      frac = i.months[mk] ? 1 : 0; label = frac ? "Cumprida" : "Pendente";
    }
    return { item:i, w, frac, label, pts:w * frac * 100 };
  });
  const pct = rows.reduce((a, r) => a + r.pts, 0);
  const reached = pct >= p.bonus.min;
  const money = p.bonus.on && reached ? p.bonus.amount * pct / 100 : 0;
  return { rows, pct, sum, money, reached };
}

/* ---------- árvore ---------- */
function card(p, id){
  const boss = id === "boss", side = id === "stock" || id === "maint" || id === "sales" || id === "check";
  const el = document.createElement("div");
  el.className = "node" + (boss ? " boss" : side ? " side" : "");
  el.dataset.id = id;
  let bar, l, r, extra = "";
  if (boss) {
    const t = p.tasks.filter(x => x.date === todayIso());
    const d = t.filter(x => x.done).length;
    bar = t.length ? Math.round(d / t.length * 100) : 0; l = `Hoje: ${d}/${t.length} feitas`; r = bar + "%";
  } else if (id === "stock") {
    const k = stockStats(p), bad = k.out + k.low;
    bar = k.n ? Math.round((k.n - bad) / k.n * 100) : 0; l = `${k.n} produtos`; r = brl(k.cost);
    extra = bad ? `<div class="badge bad">⚠ ${bad} em falta/baixo</div>` : (k.n ? `<div class="badge good">✔ Tudo em dia</div>` : "");
    extra += newBadge("stock");
  } else if (id === "maint") {
    const done = p.items.filter(i => i.status === "concluida").length, open = p.items.filter(isOpenOS).length;
    const urg = p.items.filter(i => isOpenOS(i) && i.pri === "alta").length, late = p.items.filter(lateOS).length;
    bar = p.items.length ? Math.round(done / p.items.length * 100) : 0; l = `${open} em aberto`; r = `${done} concluídas`;
    extra = urg ? `<div class="badge bad">🔴 ${urg} urgente${urg > 1 ? "s" : ""}</div>` : "";
    extra += late ? `<div class="badge bad">⏰ ${late} atrasada${late > 1 ? "s" : ""}</div>` : "";
    extra += newBadge("maint");
  } else if (id === "check") {
    const k = checkStats(p);
    bar = k.pct; l = `${k.month} revisão${k.month === 1 ? "" : "ões"} no mês`; r = `${k.types} modelos`;
    extra = k.pendOS ? `<div class="badge bad">⚠ ${k.pendOS} com problema sem OS</div>` : (k.doing ? `<div class="badge">⏳ ${k.doing} em andamento</div>` : "");
    extra += newBadge("check");
  } else if (id === "sales") {
    const k = salesStats(p);
    bar = k.n ? Math.round(p.leads.filter(x => x.stage === "ganho").length / k.n * 100) : 0; l = `${k.active} no funil`; r = brl(k.pipe);
    extra = k.due ? `<div class="badge ${k.late ? "bad" : ""}">📞 ${k.due} retorno${k.due > 1 ? "s" : ""} ${k.late ? "(" + k.late + " atrasado" + (k.late > 1 ? "s" : "") + ")" : "hoje"}</div>` : "";
  } else {
    el.style.setProperty("--c", p.color);
    const c = calc(p, monthKey(new Date()));
    bar = Math.round(c.pct); l = "Nota do mês"; r = bar + "%";
    if (p.bonus.on) extra = `<div class="badge">💰 ${brl(c.money)}</div>`;
  }
  const icon = boss ? "🧠" : id === "stock" ? "📦" : id === "maint" ? "🔧" : id === "sales" ? "🤝" : id === "check" ? "📋" : esc(initial(p.name));
  el.innerHTML = `
    <div class="avatar">${icon}</div>
    <h3>${esc(p.name)}</h3>
    <div class="role">${esc(p.role || "")}</div>
    <div class="bar"><i style="width:${bar}%"></i></div>
    <div class="stats"><span>${l}</span><span>${r}</span></div>${extra}`;
  el.onclick = () => openPanel(id);
  return el;
}
const cardFor = id => card(target(id), id);

/* ---------- novidades lançadas pelo Davi ---------- */
const seenKey = id => "seen-" + id;
const getSeen = id => { try { return +localStorage.getItem(seenKey(id)) || 0; } catch(e) { return 0; } };
function newFromDavi(id){
  const seen = getSeen(id);
  if (id === "check") return state.check.items.filter(i => i.k === "rec" && i.ub === "Davi" && i.u > seen).length;
  return id === "stock" ? state.stock.moves.filter(m => m.by === "Davi" && Date.parse(m.date) > seen).length
    : state.maint.items.filter(i => i.ub === "Davi" && i.u > seen).length;
}
const newBadge = id => { const n = MODE === "owner" ? newFromDavi(id) : 0; return n ? `<div class="badge">🆕 ${n} do Davi</div>` : ""; };

function render(){
  const rw = $("#rootWrap"), row = $("#row");
  rw.innerHTML = ""; row.innerHTML = "";
  const hub = document.createElement("div"); hub.className = "hub"; hub.id = "hub";
  if (MODE === "davi") hub.append(cardFor("maint"), cardFor("check"), cardFor("stock"));
  else hub.append(cardFor("maint"), cardFor("boss"), cardFor("stock"));
  if (MODE !== "davi") {
    const top = document.createElement("div"); top.className = "topwrap";
    top.append(cardFor("sales"), cardFor("check")); rw.appendChild(top);
  }
  rw.appendChild(hub);
  if (MODE !== "davi") {
    state.people.forEach(p => row.appendChild(card(p, p.id)));
    const add = document.createElement("div");
    add.className = "node add";
    add.innerHTML = "<div><span>+</span><div>Novo funcionário</div></div>";
    add.onclick = addPerson;
    row.appendChild(add);
  }
  requestAnimationFrame(drawLines);
}

function drawLines(){
  const svg = $("#lines"), tree = $("#tree");
  const tr = tree.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${tr.width} ${tr.height}`);
  const bn = $(".node.boss");
  if (!bn) { svg.innerHTML = ""; return; }
  const b = bn.getBoundingClientRect();
  const x1 = b.left + b.width/2 - tr.left, y1 = b.bottom - tr.top;
  let out = "";
  document.querySelectorAll("#row .node:not(.add)").forEach(n => {
    const r = n.getBoundingClientRect();
    const x2 = r.left + r.width/2 - tr.left, y2 = r.top - tr.top - 6;
    const dy = (y2 - y1) / 2;
    out += `<path d="M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}"/>`;
    out += `<polygon points="${x2-7},${y2-4} ${x2+7},${y2-4} ${x2},${y2+7}"/>`;
  });
  if (getComputedStyle($("#hub")).flexDirection === "row") {
    const bx = b.left + b.width/2 - tr.left, by = b.top - tr.top;
    ["sales", "check"].forEach(id => {
      const n = document.querySelector(`.node[data-id="${id}"]`); if (!n) return;
      const r = n.getBoundingClientRect(), x2 = r.left + r.width/2 - tr.left, tip = r.bottom - tr.top + 6, dy = (by - tip) / 2;
      out += `<path d="M${bx},${by} C${bx},${by - dy} ${x2},${tip + 8 + dy} ${x2},${tip + 8}"/>`;
      out += `<polygon points="${x2},${tip} ${x2-7},${tip+11} ${x2+7},${tip+11}"/>`;
    });
    const y = b.top + b.height/2 - tr.top;
    [["maint", -1], ["stock", 1]].forEach(([id, d]) => {
      const n = document.querySelector(`.node[data-id="${id}"]`); if (!n) return;
      const r = n.getBoundingClientRect();
      const xa = (d < 0 ? b.left : b.right) - tr.left, tip = (d < 0 ? r.right + 6 : r.left - 6) - tr.left;
      out += `<path d="M${xa},${y} L${tip - d*8},${y}"/>`;
      out += `<polygon points="${tip},${y} ${tip - d*11},${y-7} ${tip - d*11},${y+7}"/>`;
    });
  }
  svg.innerHTML = out;
}
addEventListener("resize", drawLines);

function addPerson(){
  const p = { id:uid(), name:"Novo funcionário", role:"", color:COLORS[state.people.length % COLORS.length],
    bonus:{ on:false, amount:0, min:0 }, items:[] };
  state.people.push(p); save(); render(); openPanel(p.id, true);
}

/* ---------- painel ---------- */
const panel = $("#panel");
function openPanel(id, focusName){
  if (MODE === "davi" && !["stock", "maint", "check"].includes(id)) return;
  ui.prevSeen = 0;
  if (MODE === "owner" && (id === "stock" || id === "maint" || id === "check")) { ui.prevSeen = getSeen(id); try { localStorage.setItem(seenKey(id), String(Date.now())); } catch(e) {} }
  ui.id = id; ui.tab = "demanda"; ui.mk = monthKey(new Date()); ui.cur = todayIso();
  ui.q = ""; ui.cat = ""; ui.formOpen = false; ui.edit = null; ui.mov = null; ui.stab = "prod"; ui.mf = "todas"; ui.mOpen = null; ui.mNew = false; ui.mq = ""; ui.mt = ""; ui.ct = "lista"; ui.cOpen = null; ui.cNew = false; ui.cq = ""; ui.cfT = ""; ui.cfS = ""; ui.kt = "rev"; ui.kOpen = null; ui.kType = null; ui.kNew = false; ui.kNewType = false; ui.kq = ""; ui.kfT = ""; ui.kPick = null; ui.ks = "";
  renderPanel();
  panel.scrollTop = 0;
  panel.classList.add("open"); $("#overlay").classList.add("open");
  if (focusName) setTimeout(() => { const i = panel.querySelector(".name"); i.focus(); i.select(); }, 300);
}
function closePanel(){
  ui.id = null;
  panel.classList.remove("open"); $("#overlay").classList.remove("open");
}
$("#overlay").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

const ICONS = { boss:"🧠", stock:"📦", maint:"🔧", sales:"🤝", check:"📋" };
function header(p, icon){
  const bg = icon ? "linear-gradient(135deg,#7c5cff,#22d3ee)" : p.color;
  return `<div class="ph">
    <div class="avatar" style="background:${bg}">${icon || esc(initial(p.name))}</div>
    <div class="info">
      <input class="name" data-f="name" value="${esc(p.name)}" aria-label="Nome" ${MODE === "davi" ? "readonly" : ""}>
      <input class="rolei" data-f="role" value="${esc(p.role || "")}" placeholder="Cargo / descrição" aria-label="Cargo" ${MODE === "davi" ? "readonly" : ""}>
    </div>
    <button class="x" data-act="close" aria-label="Fechar">✕</button>
  </div>`;
}

function renderPanel(){
  const p = target(ui.id); if (!p) return closePanel();
  const sc = panel.scrollTop, id = ui.id, side = id in ICONS;
  panel.classList.toggle("wide", side);
  panel.style.setProperty("--c", side ? "var(--accent)" : p.color);
  const body = id === "boss" ? bossHtml(p) : id === "stock" ? stockHtml(p) : id === "maint" ? maintHtml(p) : id === "sales" ? salesHtml(p) : id === "check" ? checkHtml(p) : empHtml(p);
  panel.innerHTML = header(p, ICONS[id]) + body;
  panel.scrollTop = sc;
}

/* --- funcionário --- */
function empHtml(p){
  const c = calc(p, ui.mk);
  const nav = `<div class="nav">
    <button data-act="mnav" data-d="-1" aria-label="Mês anterior">‹</button>
    <div class="ttl">${mkLabel(ui.mk)}</div>
    <button data-act="mnav" data-d="1" aria-label="Próximo mês">›</button></div>`;
  const tabs = `<div class="tabs">
    ${[["demanda","Demandas"],["meta","Metas"],["bonus","Bonificação"]].map(([k,l]) =>
      `<button data-act="tab" data-t="${k}" class="${ui.tab===k?"on":""}">${l}${k==="bonus"&&p.bonus.on?" 💰":""}</button>`).join("")}
  </div>`;
  const summary = `<div class="mini"><span>Nota do mês</span><b>${c.pct.toFixed(0)}%${p.bonus.on ? " · " + brl(c.money) : ""}</b></div>`;
  let body = "";
  if (ui.tab === "bonus") body = bonusHtml(p, c);
  else body = listHtml(p, c);
  const rm = `<button class="danger" data-act="rm">Remover funcionário</button>`;
  return nav + tabs + (ui.tab === "bonus" ? "" : summary) + body + rm;
}

function listHtml(p, c){
  const type = ui.tab;
  const rows = c.rows.filter(r => r.item.type === type);
  const today = todayIso();
  const form = `<form class="addform" data-form="item">
    <input type="text" name="text" placeholder="${type==="demanda" ? "Nova demanda (todo dia)…" : "Nova meta do mês…"}" autocomplete="off">
    <input type="number" name="weight" placeholder="Peso %" min="0" max="100" step="1">
    <button class="go" type="submit" aria-label="Adicionar">+</button></form>`;
  const li = rows.map(r => {
    const i = r.item;
    const cfg = `<div class="cfg">Peso <input type="number" data-f="weight" data-id="${i.id}" value="${i.weight}" min="0" max="100"> %
      ${type === "demanda" ? `· Meta <input type="number" data-f="target" data-id="${i.id}" value="${i.target || weekdaysIn(ui.mk)}" min="1" max="31"> dias no mês` : ""}</div>`;
    if (type === "meta") {
      const on = !!i.months[ui.mk];
      return `<li class="stk ${on ? "done" : ""}"><div class="top">
        <button class="dotc ${on ? "on" : ""}" data-act="mtoggle" data-id="${i.id}" aria-label="Marcar meta"></button>
        <div class="t">${esc(i.text)}<small>${on ? "Cumprida em " : "Pendente em "}${mkLabel(ui.mk)}</small></div>
        <button class="del" data-act="delitem" data-id="${i.id}" aria-label="Remover">✕</button></div>${cfg}</li>`;
    }
    let dots = "";
    for (let d = 1; d <= daysIn(ui.mk); d++) {
      const key = `${ui.mk}-${pad(d)}`, w = parse(key).getDay();
      dots += `<button class="dd ${i.days[key] ? "on" : ""} ${w===0||w===6 ? "we" : ""} ${key===today ? "td" : ""}"
        data-act="day" data-id="${i.id}" data-day="${key}" title="${DSEM[w]} ${d}">${d}</button>`;
    }
    return `<li class="stk"><div class="top"><div class="t">${esc(i.text)}</div>
      <span class="cnt">${r.label}</span>
      <button class="del" data-act="delitem" data-id="${i.id}" aria-label="Remover">✕</button></div>
      <div class="dots">${dots}</div>${cfg}</li>`;
  }).join("") || `<div class="empty">Nenhuma ${type === "demanda" ? "demanda" : "meta"} ainda.<br>Adicione acima ☝️</div>`;
  return form + `<ul>${li}</ul>`;
}

function bonusHtml(p, c){
  const b = p.bonus;
  let h = `<div class="sub">Esse funcionário tem bonificação?</div>
    <div class="seg"><button data-act="bonuson" data-v="1" class="${b.on?"on":""}">Sim</button>
    <button data-act="bonuson" data-v="0" class="${!b.on?"on":""}">Não</button></div>`;
  if (!b.on) return h + `<div class="empty">Sem bonificação para este funcionário.</div>`;
  h += `<div class="frow">
    <label class="fld">Bonificação máxima (R$)<input type="number" data-f="amount" value="${b.amount}" min="0" step="10"></label>
    <label class="fld">Nota mínima para receber (%)<input type="number" data-f="min" value="${b.min}" min="0" max="100"></label></div>`;
  h += `<div class="nav">
    <button data-act="mnav" data-d="-1">‹</button><div class="ttl">${mkLabel(ui.mk)}</div>
    <button data-act="mnav" data-d="1">›</button></div>`;
  h += `<div class="score"><div class="big">
      <div><small>Nota do mês</small><div class="pct">${c.pct.toFixed(0)}%</div></div>
      <div style="text-align:right"><small>${c.reached ? "Bonificação do mês" : `Abaixo do mínimo (${b.min}%)`}</small><div class="money">${brl(c.money)}</div></div>
    </div><div class="bar"><i style="width:${Math.min(100,c.pct)}%"></i></div></div>`;
  if (!c.rows.length) return h + `<div class="empty">Cadastre demandas e metas para calcular.</div>`;
  if (c.sum > 0 && Math.round(c.sum) !== 100) h += `<div class="warn">Os pesos somam ${c.sum}%. Eles serão ajustados proporcionalmente para fechar 100%.</div>`;
  if (c.sum === 0) h += `<div class="warn">Nenhum peso definido: todos os itens valem o mesmo.</div>`;
  h += `<table><tr><th>Item</th><th class="r">Peso</th><th class="r">Feito</th><th class="r">Pontos</th></tr>` +
    c.rows.map(r => `<tr><td>${r.item.type === "meta" ? "🎯" : "🔁"} ${esc(r.item.text)}</td>
      <td class="r">${(r.w*100).toFixed(0)}%</td><td class="r">${r.label}</td><td class="r">${r.pts.toFixed(1)}</td></tr>`).join("") + `</table>`;
  return h;
}

/* --- você (cérebro): calendário --- */
const tasksOn = d => state.boss.tasks.filter(t => t.date === d).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
const fmtLong = s => cap(parse(s).toLocaleDateString("pt-BR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }));

function taskLi(t){
  return `<li class="${t.done ? "done" : ""}">
    <button class="dotc ${t.done ? "on" : ""}" data-act="ttoggle" data-id="${t.id}" aria-label="Marcar"></button>
    <div class="t">${esc(t.text)}${t.time ? `<small>${t.time}</small>` : ""}</div>
    <button class="del" data-act="tdel" data-id="${t.id}" aria-label="Remover">✕</button></li>`;
}
function dayList(d){
  const t = tasksOn(d), n = t.filter(x => x.done).length;
  return `<div class="sub">${fmtLong(d)} · ${n}/${t.length} feitas</div>
    <ul>${t.map(taskLi).join("") || `<div class="empty">Nada marcado para este dia.</div>`}</ul>`;
}

function bossHtml(p){
  const v = ui.view, cur = ui.cur, c = parse(cur);
  const views = `<div class="views">${[["dia","Diário"],["semana","Semanal"],["mes","Mensal"],["ano","Anual"]].map(([k,l]) =>
    `<button data-act="view" data-v="${k}" class="${v===k?"on":""}">${l}</button>`).join("")}</div>`;
  let title, step;
  if (v === "dia") { title = fmtLong(cur); }
  else if (v === "semana") { const a = mondayOf(cur), b = addDays(a, 6), A = parse(a), B = parse(b);
    title = `${A.getDate()} ${MESES[A.getMonth()].slice(0,3)} – ${B.getDate()} ${MESES[B.getMonth()].slice(0,3)} ${B.getFullYear()}`; }
  else if (v === "mes") title = mkLabel(monthKey(c));
  else title = String(c.getFullYear());
  const nav = `<div class="nav"><button data-act="cnav" data-d="-1" aria-label="Anterior">‹</button>
    <div class="ttl">${title}</div>
    <button data-act="today">Hoje</button>
    <button data-act="cnav" data-d="1" aria-label="Próximo">›</button></div>`;
  const form = `<form class="addform" data-form="task">
    <input type="text" name="text" placeholder="Nova demanda / compromisso…" autocomplete="off">
    <input type="date" name="date" value="${cur}">
    <input type="time" name="time">
    <button class="go" type="submit" aria-label="Adicionar">+</button></form>`;
  let body = "";
  if (v === "dia") body = dayList(cur);
  else if (v === "semana") {
    const a = mondayOf(cur);
    body = `<div class="wk">` + [0,1,2,3,4,5,6].map(n => {
      const d = addDays(a, n), t = tasksOn(d), D = parse(d);
      return `<div class="col ${d===cur?"sel":""} ${d===todayIso()?"today":""}">
        <button class="hd" data-act="pick" data-date="${d}">${DSEM[D.getDay()]}<small>${D.getDate()}/${pad(D.getMonth()+1)}</small></button>
        ${t.map(x => `<div class="ct ${x.done?"done":""}"><button class="dotc ${x.done?"on":""}" data-act="ttoggle" data-id="${x.id}" aria-label="Marcar"></button>
          <span>${esc(x.text)}${x.time ? `<small>${x.time}</small>` : ""}</span></div>`).join("")}</div>`;
    }).join("") + `</div>` + dayList(cur);
  } else if (v === "mes") {
    const mk = monthKey(c), first = `${mk}-01`, start = mondayOf(first);
    const total = Math.ceil((((parse(first).getDay()+6) % 7) + daysIn(mk)) / 7) * 7;
    let cells = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(x => `<div class="dh">${x}</div>`).join("");
    for (let n = 0; n < total; n++) {
      const d = addDays(start, n), t = tasksOn(d);
      cells += `<button class="cell ${d.startsWith(mk)?"":"out"} ${d===cur?"sel":""} ${d===todayIso()?"today":""}" data-act="pick" data-date="${d}">
        <b>${parse(d).getDate()}</b><div class="dd2">${t.slice(0,6).map(x => `<i class="${x.done?"on":""}"></i>`).join("")}</div></button>`;
    }
    body = `<div class="mg">${cells}</div>` + dayList(cur);
  } else {
    const y = c.getFullYear();
    body = `<div class="yg">` + MESES.map((m, i) => {
      const mk = `${y}-${pad(i+1)}`, t = state.boss.tasks.filter(x => x.date.startsWith(mk)), d = t.filter(x => x.done).length;
      return `<button class="ym ${mk===monthKey(new Date())?"now":""}" data-act="gomonth" data-date="${mk}-01">
        <h4>${m}</h4><small>${d}/${t.length} feitas</small>
        <div class="bar"><i style="width:${t.length ? d/t.length*100 : 0}%"></i></div></button>`;
    }).join("") + `</div>`;
  }
  return views + nav + form + body;
}

/* ---------- estoque ---------- */
const UNITS = ["un","cx","pç","kg","g","m","L","pct","par"];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtQ = n => (Math.round(n * 1000) / 1000).toLocaleString("pt-BR");
const fmtDT = s => { const d = new Date(s); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }); };
const fmtD = s => s ? s.split("-").reverse().join("/") : "";
const stStatus = i => i.qty <= 0 ? ["Sem estoque", "bad"] : (i.min > 0 && i.qty <= i.min ? ["Baixo", "warn"] : ["OK", "ok"]);
const MV = { in:["Entrada","ok"], out:["Saída","bad"], adj:["Ajuste","warn"] };

function stockStats(s){
  let units = 0, cost = 0, sale = 0, low = 0, out = 0;
  s.items.forEach(i => { units += i.qty; cost += i.qty * i.cost; sale += i.qty * i.price;
    if (i.qty <= 0) out++; else if (i.min > 0 && i.qty <= i.min) low++; });
  return { n:s.items.length, units, cost, sale, low, out };
}

function stockHtml(s){
  const k = stockStats(s);
  const kp = (l, v, c = "") => `<div class="kpi ${c}"><small>${l}</small><b>${v}</b></div>`;
  const cats = [...new Set(s.items.map(i => i.category).filter(Boolean))].sort();
  let h = `<div class="kpis">${kp("Produtos cadastrados", k.n)}${kp("Valor em estoque (custo)", brl(k.cost))}
    ${kp("Valor de venda potencial", brl(k.sale))}${kp("Atenção", `${k.out} sem estoque · ${k.low} baixo`, k.out + k.low ? "warn" : "")}</div>`;
  h += `<div class="tabs"><button data-act="stab" data-t="prod" class="${ui.stab==="prod"?"on":""}">Produtos</button>
    <button data-act="stab" data-t="mov" class="${ui.stab==="mov"?"on":""}">Movimentações</button></div>`;
  h += `<div class="addform"><input type="text" data-f="q" placeholder="Buscar produto, SKU, local, fornecedor…" value="${esc(ui.q)}" autocomplete="off">`;
  if (ui.stab === "prod") h += `<select data-f="cat" aria-label="Categoria"><option value="">Todas as categorias</option>
      ${cats.map(c => `<option ${c===ui.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <button class="btn primary" data-act="newprod">+ Novo produto</button><button class="btn" data-act="csv">Exportar CSV</button>`;
  h += `</div>`;
  if (ui.formOpen) h += prodForm(s, cats);
  if (ui.mov) {
    const it = s.items.find(i => i.id === ui.mov.id), t = ui.mov.type;
    if (it) h += `<form class="addform movf" data-form="move"><b>${t==="in" ? "➕ Entrada" : t==="out" ? "➖ Saída" : "⚖ Ajuste de inventário"} — ${esc(it.name)}
      <small style="color:var(--muted)">(saldo atual: ${fmtQ(it.qty)} ${esc(it.unit)})</small></b>
      <input type="number" name="qty" step="any" min="0" placeholder="${t==="adj" ? "Quantidade contada" : "Quantidade"}" required>
      <input type="text" name="note" placeholder="Observação (nota fiscal, motivo, quem retirou…)">
      <button class="go" type="submit" aria-label="Confirmar">✓</button>
      <button class="btn" type="button" data-act="cancel">Cancelar</button></form>`;
  }
  return h + `<div id="stlist">${stockList()}</div>`;
}

function prodForm(s, cats){
  const it = ui.edit ? s.items.find(i => i.id === ui.edit) : null;
  const v = k => it ? esc(it[k]) : "";
  const fld = (label, name, type = "text", extra = "", cls = "") =>
    `<label class="fld ${cls}">${label}<input type="${type}" name="${name}" value="${v(name)}" ${extra}></label>`;
  return `<form class="pf" data-form="prod">
    <input type="hidden" name="id" value="${it ? it.id : ""}">
    ${fld("Produto *", "text", "text", "required", "wide").replace(`value="${v("text")}"`, `value="${it ? esc(it.name) : ""}"`)}
    ${fld("Código / SKU", "sku")}
    <label class="fld">Categoria<input type="text" name="category" list="cats" value="${v("category")}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>
    <label class="fld">Unidade<select name="unit">${UNITS.map(u => `<option ${it && it.unit===u ? "selected" : ""}>${u}</option>`).join("")}</select></label>
    ${it ? "" : fld("Quantidade inicial", "qty", "number", 'min="0" step="any"')}
    ${fld("Estoque mínimo", "min", "number", 'min="0" step="any"')}
    ${fld("Custo unitário (R$)", "cost", "number", 'min="0" step="0.01"')}
    ${fld("Preço de venda (R$)", "price", "number", 'min="0" step="0.01"')}
    ${fld("Local / prateleira", "location")}
    ${fld("Fornecedor", "supplier")}
    <div class="bt"><button type="button" class="btn" data-act="cancel">Cancelar</button><button type="submit" class="btn primary">${it ? "Salvar alterações" : "Cadastrar produto"}</button></div>
  </form>`;
}

function stockList(){
  const s = state.stock, q = ui.q.trim().toLowerCase();
  if (ui.stab === "mov") {
    const rows = s.moves.filter(m => !q || (m.pname + " " + m.note).toLowerCase().includes(q)).slice(0, 200);
    if (!rows.length) return `<div class="empty">Nenhuma movimentação registrada.</div>`;
    return `<div class="tw"><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th class="r">Qtd</th><th class="r">Saldo</th><th>Obs.</th><th>Por</th></tr>` +
      rows.map(m => `<tr><td>${fmtDT(m.date)}</td><td>${esc(m.pname)}</td><td><span class="pill ${MV[m.type][1]}">${MV[m.type][0]}</span></td>
        <td class="r">${m.delta > 0 ? "+" : ""}${fmtQ(m.delta)} ${esc(m.unit)}</td><td class="r">${fmtQ(m.after)}</td><td>${esc(m.note || "")}</td><td>${MODE === "owner" && m.by === "Davi" && Date.parse(m.date) > ui.prevSeen ? "🆕 " : ""}${esc(byLabel(m.by))}</td></tr>`).join("") + `</table></div>`;
  }
  const rows = s.items.filter(i => (!ui.cat || i.category === ui.cat) &&
    (!q || [i.name, i.sku, i.category, i.location, i.supplier].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (!rows.length) return `<div class="empty">${s.items.length ? "Nada encontrado com esse filtro." : "Estoque vazio.<br>Clique em “+ Novo produto” para lançar o primeiro."}</div>`;
  const tot = rows.reduce((a, i) => a + i.qty * i.cost, 0);
  return `<div class="tw"><table><tr><th>SKU</th><th>Produto</th><th>Categoria</th><th class="r">Qtd</th><th class="r">Mín.</th>
    <th class="r">Custo</th><th class="r">Preço</th><th class="r">Valor (custo)</th><th></th></tr>` +
    rows.map(i => { const [lb, cl] = stStatus(i); return `<tr>
      <td>${esc(i.sku)}</td>
      <td><b>${esc(i.name)}</b><small>${[i.location && "📍 " + esc(i.location), i.supplier && esc(i.supplier)].filter(Boolean).join(" · ")}</small></td>
      <td>${esc(i.category)}</td>
      <td class="r"><span class="pill ${cl}" title="${lb}">${fmtQ(i.qty)} ${esc(i.unit)}</span></td>
      <td class="r">${i.min ? fmtQ(i.min) : "—"}</td><td class="r">${brl(i.cost)}</td><td class="r">${brl(i.price)}</td>
      <td class="r">${brl(i.qty * i.cost)}</td>
      <td class="act">
        <button class="ib" data-act="mov" data-t="in" data-id="${i.id}" title="Entrada" aria-label="Entrada">➕</button>
        <button class="ib" data-act="mov" data-t="out" data-id="${i.id}" title="Saída" aria-label="Saída">➖</button>
        <button class="ib" data-act="mov" data-t="adj" data-id="${i.id}" title="Ajustar (inventário)" aria-label="Ajustar">⚖</button>
        <button class="ib" data-act="edit" data-id="${i.id}" title="Editar" aria-label="Editar">✎</button>
        <button class="ib" data-act="delprod" data-id="${i.id}" title="Excluir" aria-label="Excluir">✕</button></td></tr>`; }).join("") +
    `<tr><td colspan="7" style="color:var(--muted)">${rows.length} produto(s)</td><td class="r"><b>${brl(tot)}</b></td><td></td></tr></table></div>`;
}

function stockClick(a, D, s){
  if (a === "stab") { ui.stab = D.t; ui.formOpen = false; ui.mov = null; renderPanel(); return true; }
  if (a === "newprod") { ui.formOpen = !ui.formOpen; ui.edit = null; ui.mov = null; renderPanel(); return true; }
  if (a === "edit") { ui.edit = D.id; ui.formOpen = true; ui.mov = null; renderPanel(); return true; }
  if (a === "cancel") { ui.formOpen = false; ui.edit = null; ui.mov = null; renderPanel(); return true; }
  if (a === "mov") { ui.mov = { id:D.id, type:D.t }; ui.formOpen = false; renderPanel(); const q = panel.querySelector('[name=qty]'); if (q) q.focus(); return true; }
  if (a === "delprod") {
    const it = s.items.find(i => i.id === D.id);
    if (!confirm(`Excluir "${it.name}" do estoque?`)) return true;
    s.items = s.items.filter(i => i !== it); s.moves = s.moves.filter(m => m.pid !== it.id); s.del[it.id] = Date.now(); refresh(); return true;
  }
  if (a === "csv") {
    const head = ["SKU","Produto","Categoria","Unidade","Quantidade","Mínimo","Custo","Preço","Local","Fornecedor"];
    const rows = s.items.map(i => [i.sku, i.name, i.category, i.unit, i.qty, i.min, i.cost, i.price, i.location, i.supplier]);
    const csv = [head, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
    el.download = `estoque-${todayIso()}.csv`; el.click(); URL.revokeObjectURL(el.href); return true;
  }
  return false;
}

function sideChange(e, f){
  if (f === "cat") { ui.cat = e.target.value; renderPanel(); }
}

function sideSubmit(form, fd, p){
  const kind = form.dataset.form;
  if (ui.id === "maint") return maintSubmit(form, fd, p);
  if (ui.id === "sales") return salesSubmit(form, fd, p);
  if (ui.id === "check") return checkSubmit(form, fd, p);
  if (kind === "prod") {
    const name = (fd.get("text") || "").trim(); if (!name) return;
    const data = { name, sku:(fd.get("sku") || "").trim(), category:(fd.get("category") || "").trim(), unit:fd.get("unit") || "un",
      min:Math.max(0, num(fd.get("min"))), cost:Math.max(0, num(fd.get("cost"))), price:Math.max(0, num(fd.get("price"))),
      location:(fd.get("location") || "").trim(), supplier:(fd.get("supplier") || "").trim() };
    const id = fd.get("id");
    if (id) stamp(Object.assign(p.items.find(i => i.id === id), data));
    else {
      const it = stamp(Object.assign({ id:uid(), qty:0 }, data)), q = Math.max(0, num(fd.get("qty")));
      p.items.push(it);
      if (q > 0) { it.qty = q; stockMove(p, it, "in", q, "Estoque inicial"); }
    }
    ui.formOpen = false; ui.edit = null; return refresh();
  }
  if (kind === "move") {
    const it = p.items.find(i => i.id === ui.mov.id), t = ui.mov.type, q = num(fd.get("qty")), note = (fd.get("note") || "").trim();
    if (!it || q < 0 || (t !== "adj" && q <= 0)) return;
    let delta;
    if (t === "in") delta = q;
    else if (t === "out") { if (q > it.qty) { alert(`Saldo insuficiente: só há ${fmtQ(it.qty)} ${it.unit} em estoque.`); return; } delta = -q; }
    else delta = q - it.qty;
    if (delta !== 0) { it.qty += delta; stamp(it); stockMove(p, it, t, delta, note); }
    ui.mov = null; return refresh();
  }
}
function stockMove(s, it, type, delta, note){
  s.moves.unshift({ by:ME(), id:uid(), pid:it.id, pname:it.name, unit:it.unit, type, delta, after:it.qty, note, date:new Date().toISOString() });
  if (s.moves.length > 3000) s.moves.length = 3000;
}

/* ---------- eventos do painel ---------- */
function refresh(){ save(); renderPanel(); render(); }
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = target(ui.id), D = b.dataset, a = D.act;
  const item = () => p.items.find(i => i.id === D.id);
  const task = () => p.tasks.find(t => t.id === D.id);
  if (a === "close") return closePanel();
  if (ui.id === "stock" && stockClick(a, D, p)) return;
  if (ui.id === "maint" && maintClick(a, D, p)) return;
  if (ui.id === "sales" && salesClick(a, D, p)) return;
  if (ui.id === "check" && checkClick(a, D, p)) return;
  if (a === "tab") { ui.tab = D.t; return renderPanel(); }
  if (a === "mnav") { ui.mk = shiftMonth(ui.mk, +D.d); return renderPanel(); }
  if (a === "day") { const i = item(); i.days[D.day] = !i.days[D.day]; if (!i.days[D.day]) delete i.days[D.day]; return refresh(); }
  if (a === "mtoggle") { const i = item(); i.months[ui.mk] = !i.months[ui.mk]; return refresh(); }
  if (a === "delitem") { p.items = p.items.filter(i => i.id !== D.id); return refresh(); }
  if (a === "bonuson") { p.bonus.on = D.v === "1"; return refresh(); }
  if (a === "rm") {
    if (!confirm(`Remover ${p.name} e tudo que está no card?`)) return;
    state.people = state.people.filter(x => x !== p); save(); closePanel(); return render();
  }
  // calendário
  if (a === "view") { ui.view = D.v; return renderPanel(); }
  if (a === "today") { ui.cur = todayIso(); return renderPanel(); }
  if (a === "cnav") {
    const n = +D.d, c = parse(ui.cur);
    if (ui.view === "dia") ui.cur = addDays(ui.cur, n);
    else if (ui.view === "semana") ui.cur = addDays(ui.cur, 7 * n);
    else if (ui.view === "mes") ui.cur = iso(new Date(c.getFullYear(), c.getMonth() + n, 1));
    else ui.cur = iso(new Date(c.getFullYear() + n, c.getMonth(), 1));
    return renderPanel();
  }
  if (a === "pick") { ui.cur = D.date; return renderPanel(); }
  if (a === "gomonth") { ui.cur = D.date; ui.view = "mes"; return renderPanel(); }
  if (a === "ttoggle") { const t = task(); t.done = !t.done; return refresh(); }
  if (a === "tdel") { p.tasks = p.tasks.filter(t => t.id !== D.id); return refresh(); }
});
panel.addEventListener("input", e => {
  const f = e.target.dataset.f, p = target(ui.id);
  if (f === "q") { ui.q = e.target.value; const l = $("#stlist"); if (l) l.innerHTML = stockList(); return; }
  if (f === "mq") { ui.mq = e.target.value; const l = $("#mlist"); if (l) l.innerHTML = maintList(); return; }
  if (f === "ks") { ui.ks = e.target.value; const l = $("#kpick"); if (l) l.innerHTML = pickList(); return; }
  if (f === "kq") { ui.kq = e.target.value; const l = $("#klist"); if (l) l.innerHTML = checkList(); return; }
  if (f === "cq") { ui.cq = e.target.value; const l = $("#clist"); if (l) l.innerHTML = salesList(); return; }
  if (f !== "name" && f !== "role") return;
  if (f === "name") p.name = e.target.value || "Sem nome"; else p.role = e.target.value;
  save();
  const old = document.querySelector(`.node[data-id="${ui.id}"]`);
  old.replaceWith(cardFor(ui.id)); drawLines();
});
panel.addEventListener("change", e => {
  const f = e.target.dataset.f, p = target(ui.id); if (!f || f === "name" || f === "role" || f === "q" || f === "mq" || f === "cq" || f === "kq" || f === "ks") return;
  if (ui.id === "stock") return sideChange(e, f);
  if (ui.id === "maint") return maintChange(e, f, p);
  if (ui.id === "sales") return salesChange(e, f, p);
  if (ui.id === "check") return checkChange(e, f, p);
  const v = Math.max(0, +e.target.value || 0);
  if (f === "amount" || f === "min") p.bonus[f] = v;
  else { const i = p.items.find(x => x.id === e.target.dataset.id); i[f] = v; }
  refresh();
});
panel.addEventListener("submit", e => {
  e.preventDefault();
  const p = target(ui.id), fd = new FormData(e.target), text = (fd.get("text") || "").trim();
  if (ui.id === "stock" || ui.id === "maint" || ui.id === "sales" || ui.id === "check") return sideSubmit(e.target, fd, p);
  if (!text) return;
  if (e.target.dataset.form === "task") {
    p.tasks.push({ id:uid(), text, date:fd.get("date") || ui.cur, time:fd.get("time") || "", done:false });
    if (fd.get("date")) ui.cur = fd.get("date");
  } else {
    p.items.push({ id:uid(), type:ui.tab, text, weight:Math.max(0, +fd.get("weight") || 0), target:0, days:{}, months:{} });
  }
  refresh();
  const t = panel.querySelector('input[name="text"]'); if (t) t.focus();
});

/* ---------- backup ---------- */
$("#addTop").onclick = addPerson;
$("#exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...state, davi:undefined }, null, 2)], { type:"application/json" }));
  a.download = "minha-equipe-backup.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.boss || !Array.isArray(s.people)) throw 0;
    if (!confirm("Isso substitui os dados atuais. Continuar?")) return;
    state = normalize(s); save(); closePanel(); render();
  } catch { alert("Arquivo inválido."); }
  e.target.value = "";
};

/* ---------- sincronização online ---------- */
const SK = "equipe-key";
let KEYV = "", syncing = false, again = false;
function setSync(t, cls){ const el = $("#sync"); if (el) { el.textContent = t; el.className = "sync " + (cls || ""); } }

async function api(method, body, action){
  const r = await fetch("/api/state" + (action ? "?a=" + action : ""), {
    method, cache:"no-store", headers:{ "x-key":KEYV, "content-type":"application/json" }, body:body ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw Object.assign(new Error("401"), { auth:true });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

function applyServer(d){
  const snap = () => JSON.stringify([state.stock, state.maint, state.check, MODE === "owner" ? [state.boss, state.people, state.crm] : 0]);
  const before = snap();
  const davi = MODE === "davi";
  state.stock = Merge.mergeShared(d.stock, state.stock, davi);
  state.maint = Merge.mergeShared(d.maint, state.maint, davi);
  state.check = Merge.mergeShared(d.check, state.check, davi);
  if (MODE === "owner") {
    if (d.core && (+d.core.u || 0) > coreU) { state.boss = d.core.boss; state.people = d.core.people; state.crm = d.core.crm || state.crm; coreU = +d.core.u; }
    state.davi = d.davi;
  }
  normalize(state);
  persistLocal();
  if (snap() !== before) { render(); safeRenderPanel(); }
}

// não refaz o painel se o usuário estiver digitando
function safeRenderPanel(){
  if (!ui.id) return;
  const a = document.activeElement;
  if (a && panel.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (ui.formOpen || ui.mov) return;
  if ([...panel.querySelectorAll("form input[type=text], form textarea")].some(x => x.value)) return;
  renderPanel();
}

function syncError(e){
  if (e.auth) { try { localStorage.removeItem(SK); } catch(x) {} return showLocked(true); }
  setSync("⚠ Sem conexão — tento de novo", "bad");
  clearTimeout(syncTimer); syncTimer = setTimeout(push, 8000);
}

async function pull(){
  try { applyServer(await api("GET")); setSync("☁ Sincronizado", "ok"); } catch(e) { syncError(e); }
}
async function push(){
  if (syncing) { again = true; return; }
  syncing = true;
  const body = MODE === "owner"
    ? { core:{ boss:state.boss, people:state.people, crm:state.crm, u:coreU || Date.now() }, stock:state.stock, maint:state.maint, check:state.check }
    : { stock:state.stock, maint:state.maint, check:state.check };
  try { applyServer(await api("PUT", body)); setSync("☁ Sincronizado", "ok"); } catch(e) { syncError(e); }
  syncing = false;
  if (again) { again = false; push(); }
}

function showLocked(bad){
  document.body.className = "";
  document.body.innerHTML = `<div class="locked"><h2>🔒 Acesso restrito</h2>
    <p>${bad ? "Este link foi desativado ou trocado. Peça um link novo ao responsável." : "Abra o sistema pelo link de acesso que você recebeu."}</p></div>`;
}

const hasData = c => !!c && ((c.people || []).length || ((c.boss && c.boss.tasks) || []).length || ((c.crm && c.crm.leads) || []).length);

async function boot(){
  const params = new URLSearchParams(location.search);
  let k = params.get("k");
  try { if (k) localStorage.setItem(SK, k); else k = localStorage.getItem(SK) || ""; } catch(e) {}
  if (params.has("k")) history.replaceState(null, "", location.pathname);

  if (location.protocol === "file:" || params.has("local")) { state = load(); render(); showAgenda(); return; }
  if (!k) return showLocked(false);
  KEYV = k;

  let d;
  try { d = await api("GET"); }
  catch (e) {
    if (e.auth) return showLocked(true);
    MODE = localStorage.getItem("equipe-role") || "owner";           // sem internet: usa a cópia deste aparelho
  }
  if (d) { MODE = d.role; try { localStorage.setItem("equipe-role", MODE); } catch(e) {} }
  KEY = MODE === "davi" ? "minha-equipe-davi" : "minha-equipe-v1";
  document.body.classList.toggle("davi", MODE === "davi");
  document.body.classList.toggle("srv", MODE === "owner");
  if (MODE === "davi") $("#title").textContent = "🔧 MANUTENÇÃO & ESTOQUE";
  state = load();

  if (d && MODE === "owner" && hasData(d.core)) {
    let useServer = true;
    if (hasData(state) || state.people.length) {
      let linked = false; try { linked = localStorage.getItem("equipe-linked") === "1"; } catch(e) {}
      if (!linked && hasData({ boss:state.boss, people:state.people }) && JSON.stringify(state.people) !== JSON.stringify(d.core.people))
        useServer = confirm("Já existem dados online e dados diferentes neste aparelho.\n\nOK = usar os dados online\nCancelar = enviar os deste aparelho para o servidor (substitui os online)");
    }
    if (useServer) { state.boss = d.core.boss; state.people = d.core.people; state.crm = d.core.crm || state.crm; coreU = +d.core.u || 0; }
    else coreU = Date.now();
  } else if (MODE === "owner") coreU = Date.now();   // servidor vazio: sobe o que já existe aqui
  try { localStorage.setItem("equipe-linked", "1"); } catch(e) {}

  normalize(state);
  if (d) { if (MODE === "owner") state.davi = d.davi; applyServer(d); }
  render();
  push();
  showAgenda();
  setInterval(() => { if (!document.hidden && !syncing) pull(); }, 12000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
}

/* ---------- agenda de hoje (pop-up ao abrir) ---------- */
let agendaShown = false;
function showAgenda(){
  if (MODE === "davi" || agendaShown || !state || !state.boss) return;
  agendaShown = true;
  agendaModal();
}
function agendaModal(){
  const t = todayIso(), tom = addDays(t, 1), tk = state.boss.tasks;
  const byTime = (a, b) => (a.time || "99").localeCompare(b.time || "99");
  const today = tk.filter(x => x.date === t).sort(byTime);
  const late = tk.filter(x => x.date < t && !x.done).sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
  const next = tk.filter(x => x.date === tom).sort(byTime);
  if (!today.length && !late.length) { modal.classList.remove("open"); return; }
  const li = (x, showDate) => `<li class="${x.done ? "done" : ""}"><button class="dotc ${x.done ? "on" : ""}" data-ag="${x.id}" aria-label="Marcar"></button>
    <span class="tm">${x.time || "—"}</span><div class="t">${esc(x.text)}${showDate ? `<small>${fmtD(x.date)}</small>` : ""}</div></li>`;
  const pend = today.filter(x => !x.done).length;
  modal.innerHTML = `<div class="box"><h3>📅 ${fmtLong(t)}</h3>
    <p style="margin:0;color:var(--muted);font-size:.9rem">${pend ? `Você tem <b style="color:var(--text)">${pend}</b> demanda${pend > 1 ? "s" : ""} para hoje.` : "Tudo de hoje já está feito. 🎉"}</p>
    ${late.length ? `<div class="sub" style="color:var(--danger)">⚠ Atrasadas (${late.length})</div><ul class="ag">${late.map(x => li(x, true)).join("")}</ul>` : ""}
    ${today.length ? `<div class="sub">Hoje (${today.length})</div><ul class="ag">${today.map(x => li(x)).join("")}</ul>` : ""}
    ${next.length ? `<div class="sub" style="opacity:.7">Amanhã (${next.length})</div><ul class="ag" style="opacity:.7">${next.map(x => li(x)).join("")}</ul>` : ""}
    <div class="row2"><button class="btn primary" id="agopen">Abrir calendário</button><button class="btn" id="agclose">Fechar</button></div></div>`;
  modal.classList.add("open");
  modal.querySelectorAll("[data-ag]").forEach(b => b.onclick = () => {
    const x = tk.find(y => y.id === b.dataset.ag); x.done = !x.done; save(); render(); agendaModal();
  });
  $("#agclose").onclick = () => modal.classList.remove("open");
  $("#agopen").onclick = () => { modal.classList.remove("open"); openPanel("boss"); ui.view = "dia"; ui.cur = t; renderPanel(); };
}

/* ---------- acesso do Davi ---------- */
const modal = document.createElement("div"); modal.id = "modal"; document.body.appendChild(modal);
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
function openAccess(){
  const d = state.davi || { active:false };
  const link = d.key ? `${location.origin}/?k=${d.key}` : "";
  const wa = "https://wa.me/?text=" + encodeURIComponent("Davi, este é o seu link para lançar manutenções e estoque (não compartilhe): " + link);
  modal.innerHTML = `<div class="box"><h3>🔑 Acesso do Davi</h3>
    <p style="margin:0;color:var(--muted);font-size:.9rem">Quem abrir este link vê <b>apenas Manutenções e Estoque</b>. Nada do resto do painel (funcionários, bonificações, calendário) é enviado para ele.</p>
    ${d.active ? `<div class="lnk" id="lnk">${esc(link)}</div>
      <div class="row2"><button class="btn primary" id="cp">Copiar link</button><a class="btn" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Enviar no WhatsApp</a></div>
      <div class="row2"><button class="btn" id="rot">Gerar novo link</button><button class="btn" id="rev" style="color:var(--danger)">Desativar acesso</button></div>`
      : `<div class="warn">O acesso do Davi está desativado.</div><div class="row2"><button class="btn primary" id="rot">Gerar link de acesso</button></div>`}
    <button class="btn" id="mclose">Fechar</button></div>`;
  modal.classList.add("open");
  $("#mclose").onclick = () => modal.classList.remove("open");
  const cp = $("#cp"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(link); cp.textContent = "Copiado ✓"; } catch(e) { const r = document.createRange(); r.selectNode($("#lnk")); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  const act = async (a, msg) => { if (msg && !confirm(msg)) return; try { const r = await api("POST", null, a); state.davi = r.davi; openAccess(); } catch(e) { alert("Não consegui falar com o servidor. Tente de novo."); } };
  $("#rot").onclick = () => act("rotate", d.active ? "Gerar um novo link? O link atual do Davi deixa de funcionar." : "");
  const rv = $("#rev"); if (rv) rv.onclick = () => act("revoke", "Desativar o acesso do Davi? O link atual deixa de funcionar.");
}
$("#acc").onclick = openAccess;

boot();

</script>
</body>
